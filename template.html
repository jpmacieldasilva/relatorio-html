<!doctype html>
<!--
  Relatório HTML — reusable report shell
  ---------------------------------------------------------------------------
  This file is a TEMPLATE. Do not edit it per report: build.py replaces the
  placeholders below with real content and writes a single self-contained file.

    FONTS slot (in <style>)  -> @font-face rules of the theme fonts (base64 woff2)
    THEME slot (in <style>)  -> theme custom properties resolved by tema.py (temas/*.json)
    D3 / PLOT slots          -> d3 v7 (UMD) and @observablehq/plot 0.6.x (UMD)
    REPORT_JSON slot         -> the report spec + data (see SKILL.md, "The spec")
    TITLE / LANG slots       -> document title and lang attribute
  (each slot is replaced exactly once; never write a slot marker in a comment)

  Rendering model: one global filter state -> every component re-renders from
  the filtered rows. Categorical charts are computed with every filter EXCEPT
  their own dimension (classic cross-filter), so the selection stays visible
  as a highlight instead of collapsing the chart to a single bar.
-->
<html lang="__LANG__" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
/*__FONTS__*/

/* ===================================================================== */
/* Design tokens — fallbacks matching the default "Neutro" theme (TEMA.md). */
/* build.py injects the resolved theme right after this block (__THEME__), */
/* so every value here is only a fallback.                                 */
/* ===================================================================== */
:root {
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --surface-2: #F2F3F5;       /* rows, hovers, heat-low */
  --ink: #1B1F24;
  --ink-2: #2A2F35;
  --muted: #59616C;           /* solid, so Plot gets a literal */
  --faint: #8B929C;
  --rule: #E3E5E8;            /* hairlines */
  --rule-strong: #C8CDD3;     /* chart-title rules + section rules */
  --primary: #1F4E79;         /* brand color: kicker, active states (blocks layout: hero/band) */
  --primary-text: #1F4E79;    /* primary shade that passes 4.5:1 as text */
  --hero: var(--primary);
  --hero-ink: #FFFFFF;
  --hero-muted: #C9D6E3;
  --hero-rule: #4C7194;
  --hero-pos: #CFE0F1; --hero-neg: #F6C9A6;
  --accent: #3A78B5;          /* primary data color */
  --accent-deep: #2F6BA8;     /* accent that reads as text / thin strokes */
  --accent-ink: #FFFFFF;      /* text on accent */
  --pos: #2F6BA8;             /* "good" change fill */
  --pos-ink: #2F6BA8;
  --neg: #C2611F;             /* "bad" change fill */
  --neg-ink: #A4501A;
  --context: #DADDE2;         /* de-emphasised marks */
  --line: #1F4E79;            /* single-series line stroke */
  --area-op: .14;
  --tip-bg: #1B1F24; --tip-ink: #FFFFFF;
  --heat-lo: #EEF3F8; --heat-mid: #8FB4D8; --heat-hi: #1F4E79; --heat-ink-hi: #FFFFFF;
  --footer-bg: #F1F2F4; --footer-ink: #1B1F24;
  --brand-bg: transparent; --brand-ink: #1B1F24;
  --art-bg: #F1F2F4; --art-ink: #1B1F24;
  /* data palettes: categorical c1–c8 (colorblind-safe order), diverging dv1 (strong negative) … dv3 (neutral) … dv5 (strong positive) */
  --c1: #3A78B5; --c2: #E0912F; --c3: #2E9C8A; --c4: #C75B7A; --c5: #7B6BB8; --c6: #8E9A3B; --c7: #6A737D; --c8: #B4875A;
  --dv1: #B35A1F; --dv2: #E8B07F; --dv3: #E4E6E9; --dv4: #94B9DD; --dv5: #2F6BA8;
  --dv1-ink: #FFFFFF; --dv2-ink: #000000; --dv3-ink: #000000; --dv4-ink: #000000; --dv5-ink: #FFFFFF;
  /* type */
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --heading: var(--sans);
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --hw: 600;                  /* heading weight */
  --track: .35;               /* multiplier on the negative tracking of headings */
  --lh-hero: 1.1;
  --fs-hero: 52; --fs-h2: 30; --fs-chart: 18; --fs-kpi: 40; --fs-label: 14; --fs-dek: 19; --fs-body: 16;   /* unitless px at 1440 */
  /* space + shape */
  --sp-section: 96; --sp-chart: 64; --sp-band: 40;
  --radius: 10px; --rule-w: 1px; --rule-strong-w: 1px; --rule-section-w: 1px;
  /* motion: --mk multiplies every duration (theme.motion.speed) */
  --mk: .65;
  --ease-out: cubic-bezier(.22, 1, .36, 1);     /* bars/columns */
  --ease-io: cubic-bezier(.44, 0, .56, 1);      /* link + nav color */
  --ease: var(--ease-out);
  --t-bar: calc(900ms * var(--mk)); --t-stagger: calc(60ms * var(--mk)); --t-fade: calc(.4s * var(--mk)); --t-hover: calc(200ms * var(--mk));
  /* layout grid (theme layout.grid): pad | rail (chapter menu) | rail-gap | content: 12 columns + gutter | pad.
     At 1440 px: 32 | 200 | 48 | 1128 | 32 — the content column never grows past maxw − 2·pad − rail − rail-gap. */
  --hdr-h: 56px;
  --pad-d: 32px; --pad: var(--pad-d);
  --maxw: 1440px; --rail: 200px; --rail-gap: 48px; --gutter: 32px;
}
[data-theme="dark"] {
  --bg: #111418;
  --surface: #171B21;
  --surface-2: #1E232A;
  --ink: #E7E9EC;
  --ink-2: #D5D8DC;
  --muted: #A1A8B2;
  --faint: #6F7782;
  --rule: #272D35;
  --rule-strong: #3A424D;
  --accent-deep: #9CC3E8;
  --pos-ink: #9CC3E8;
  --neg-ink: #F0A06A;
  --primary-text: #7DAEDC;
  --context: #2C333C;
  --line: #9CC3E8;
  --area-op: .22;
  --tip-bg: #E7E9EC; --tip-ink: #111418;
  --heat-lo: #1E232A; --heat-mid: #3E6E9E; --heat-hi: #9CC3E8; --heat-ink-hi: #000000;
  --footer-bg: #0C0F12; --footer-ink: #E7E9EC;
  --brand-ink: #E7E9EC;
}
/*__THEME__*/

/* ===================================================================== */
/* Base                                                                   */
/* ===================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 calc(var(--fs-body) * 1px)/1.4 var(--sans); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background-color calc(.3s * var(--mk)) var(--ease-io), color calc(.3s * var(--mk)) var(--ease-io);
}
.tnum { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color calc(.2s * var(--mk)) var(--ease-io); }
.kicker, .mono { font: 400 12px/1.2 var(--mono); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.page { max-width: var(--maxw); margin: 0 auto; }
/* ONE layout grid, two zones:
   · header zone (hero, filter bar, summary, KPIs, highlights) spans the whole page width, pad to pad: "wide";
   · sections, table and methodology sit in the content column; the rail on its left is reserved for the
     chapter menu, which only fades in once the first section reaches it (never over the header zone).
   Inside either zone, blocks span 12, 6 or 4 of 12 columns (100 / 50 / 33 %) with a fixed gutter — see .grid,
   .kpi-grid, .insights ol, .method .cols and layoutGrid(). */
.g {
  display: grid; column-gap: 0;
  grid-template-columns: [full-start] var(--pad) [wide-start rail-start] var(--rail) [rail-end] var(--rail-gap) [content-start] minmax(0, 1fr) [content-end wide-end] var(--pad) [full-end];
}
.g > * { grid-column: content; min-width: 0; }
.cols12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }
.cols12 > * { grid-column: span 12; min-width: 0; }

/* Header — plain bar: brand (or logo) · chapters button · theme + PDF. Hides on scroll down, returns on scroll up. */
.hdr {
  position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--hdr-h);
  display: grid; grid-template-columns: auto auto 1fr; align-items: stretch;
  background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: var(--rule-w) solid var(--rule); color: var(--ink);
  transform: translateY(0); overflow: hidden; max-width: 100vw; transition: transform calc(.5s * var(--mk)) var(--ease-out), background-color calc(.3s * var(--mk)) var(--ease-io);
}
html.hdr-hidden .hdr { transform: translateY(-100%); }
.hdr .brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 0 var(--pad); font: 600 17px/1 var(--heading); letter-spacing: -.01em; white-space: nowrap; min-width: 0; color: var(--ink); }
.hdr .brand .badge { font: 500 10px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border: 1px solid var(--rule-strong); border-radius: 999px; color: var(--muted); }
.hdr .brand img.logo { display: block; height: var(--logo-h, 26px); width: auto; max-width: 180px; }
.hdr .seg-o { display: flex; align-items: center; padding: 0 12px; border-left: var(--rule-w) solid var(--rule); margin: 14px 0; }
.hdr .nav { display: flex; align-items: center; justify-content: flex-end; gap: clamp(16px, 2.4vw, 32px); padding: 0 var(--pad) 0 16px; }
.navbtn { border: 0; background: none; padding: 6px 0; cursor: pointer; font: 500 15px/1 var(--sans); letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; color: inherit; transition: color calc(.2s * var(--mk)) var(--ease-io), opacity calc(.2s * var(--mk)) var(--ease-io); }
.navbtn:hover { color: var(--primary-text); }
.navbtn .plus { width: 10px; height: 10px; position: relative; display: inline-block; transition: transform calc(.4s * var(--mk)) var(--ease-out); }
.navbtn .plus::before, .navbtn .plus::after { content: ""; position: absolute; background: currentColor; left: 0; top: 4.5px; width: 10px; height: 1.4px; border-radius: 1px; }
.navbtn .plus::after { transform: rotate(90deg); }
.navbtn[aria-expanded="true"] .plus { transform: rotate(45deg); }
.navbtn svg { width: 16px; height: 16px; }
.hdr .seg-o .navbtn .short { display: none; }

/* Chapter menu — side drawer on the page surface, slides in from the left */
.menu { position: fixed; z-index: 70; inset: 0 auto 0 0; width: min(380px, 92vw); background: var(--surface); color: var(--ink);
  border-right: var(--rule-w) solid var(--rule); box-shadow: 0 12px 48px rgba(15, 20, 25, .14);
  display: flex; flex-direction: column; padding: 0 0 20px; transform: translateX(-102%); visibility: hidden;
  transition: transform calc(.45s * var(--mk)) var(--ease-out), visibility calc(0s * var(--mk)) linear calc(.45s * var(--mk)); }
.menu.open { transform: none; visibility: visible; transition: transform calc(.45s * var(--mk)) var(--ease-out), visibility calc(0s * var(--mk)); }
.menu .mtop { height: var(--hdr-h); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px; border-bottom: var(--rule-w) solid var(--rule); font: 400 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); flex: none; }
.menu .mtop button { border: 0; background: none; cursor: pointer; font-size: 22px; line-height: 1; padding: 4px; color: var(--ink); }
.menu ol { list-style: none; margin: 8px 0 0; padding: 0 8px; overflow: auto; }
.menu li a { display: flex; align-items: baseline; gap: 12px; text-decoration: none; border-radius: var(--radius); padding: 12px; font: 500 18px/1.25 var(--heading); letter-spacing: -.01em; transition: background-color calc(.2s * var(--mk)) var(--ease-io), color calc(.2s * var(--mk)) var(--ease-io); }
.menu li a sup { font: 400 11px/1 var(--mono); letter-spacing: 0; color: var(--muted); min-width: 18px; }
.menu li a:hover { background: var(--surface-2); color: var(--primary-text); }
.menu .mfoot { margin-top: auto; padding: 16px 20px 0; border-top: var(--rule-w) solid var(--rule); font: 400 11px/1.3 var(--mono); text-transform: uppercase; color: var(--muted); }
.scrim { position: fixed; inset: 0; z-index: 65; background: rgba(15, 20, 25, .18); opacity: 0; pointer-events: none; transition: opacity calc(.4s * var(--mk)) var(--ease-io); }
.scrim.on { opacity: 1; pointer-events: auto; }

/* Hero (blocks layout) — full-bleed primary color, mono kicker, big headline, meta bottom-right.
   On load it opens at full viewport height and settles to its natural height. */
.hero { background: var(--hero); color: var(--hero-ink); padding-top: var(--hdr-h); }
.hero .g { min-height: clamp(380px, 54vh, 560px); align-content: end; padding-bottom: 18px; transition: min-height calc(1.1s * var(--mk)) var(--ease-out); }
html.intro .hero .g { min-height: calc(100svh - 0px); }
.hero .kicker { grid-column: wide; margin-bottom: 14px; }
.hero h1.title { grid-column: wide; font: var(--hw) clamp(calc(var(--fs-hero) * .4px), calc(var(--fs-hero) * .0695vw), calc(var(--fs-hero) * 1px))/var(--lh-hero) var(--heading); letter-spacing: calc(-.06em * var(--track)); margin: 0; max-width: 12.5em; text-wrap: balance; }
.hero .byline { grid-column: wide; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 24px; margin-top: 18px; font-size: 14px; color: var(--hero-muted); }
.hero .byline b { color: var(--hero-ink); font-weight: 400; }
.hero .byline .mob-only { display: none; }

/* Art strip — data-driven dot matrix under the hero (theme: hero.art) */
.art { position: relative; height: clamp(180px, 22vw, 320px); background: var(--art-bg); overflow: hidden; display: grid; grid-template-columns: 41.875% 1fr; }
.art canvas { width: 100%; height: 100%; display: block; clip-path: inset(0 0 0 0); transition: clip-path calc(1.6s * var(--mk)) var(--ease-out) calc(.35s * var(--mk)); }
html.intro .art canvas { clip-path: inset(0 100% 0 0); }
.art .art-r { background: var(--hero); position: relative; }

/* Statement + KPI band (blocks layout: on the primary color) */
.band { background: var(--hero); color: var(--hero-ink); padding: 0 0 calc(var(--sp-band) * 1px); }
.band .g { row-gap: 0; }
.band .rule { grid-column: wide; border-top: 1px solid var(--hero-rule); height: 0; margin-bottom: 18px; }
.band .dek { grid-column: wide; grid-row: 2; font: var(--hw) clamp(calc(var(--fs-dek) * .75px), calc(var(--fs-dek) * .0697vw), calc(var(--fs-dek) * 1px))/1.2 var(--heading); letter-spacing: calc(-.03em * var(--track)); margin: 0 0 32px; max-width: 26em; text-wrap: pretty; }
.band .dek b { font-weight: 500; }
.band #kpis { grid-column: wide; grid-row: 3; }
.band #insights { grid-column: wide; grid-row: 4; padding-top: 44px; }
.kpi-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); border-bottom: 1px solid var(--hero-rule); }
.kpi-grid > .kpi { grid-column: span 4; }
.kpi { padding: 12px 12px 18px 16px; border-left: 1px solid var(--hero-rule); min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.kpi.t { border-top: 1px solid var(--hero-rule); }
.kpi .value { order: 1; font: var(--hw) var(--kv, 85px)/1 var(--heading); letter-spacing: calc(-.04em * var(--track)); margin: 0 0 clamp(24px, 4vw, 64px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .label { order: 2; font: var(--hw) calc(var(--fs-label) * 1px)/1.2 var(--heading); letter-spacing: calc(-.03em * var(--track)); }
.kpi .delta { order: 3; margin-top: 8px; font-size: 16px; color: var(--hero-muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 6px; }
.kpi .delta .arr { color: var(--hero-ink); }
html.hero-plain { --hero-pos: var(--pos-ink); --hero-neg: var(--neg-ink); }   /* plain hero = page background */
/* good vs bad stays readable on the colored band too (M10): tints validated ≥ 4.5:1 against --hero in tema.py */
html:not(.layout-clean) .kpi .delta.good > span:first-of-type, html:not(.layout-clean) .kpi .delta.good > span:first-of-type .arr { color: var(--hero-pos, var(--hero-ink)); }
html:not(.layout-clean) .kpi .delta.bad > span:first-of-type, html:not(.layout-clean) .kpi .delta.bad > span:first-of-type .arr { color: var(--hero-neg, var(--hero-ink)); }
.kpi .delta.good .arr, .kpi .delta.bad .arr { font-size: 12px; transform: translateY(-1px); display: inline-block; }
.kpi svg.spark { order: 4; display: block; width: 100%; height: 26px; margin-top: 14px; overflow: visible; }
.insights .kicker { margin-bottom: 18px; }
.insights ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }
.insights li { grid-column: span 4; min-width: 0; break-inside: avoid; margin: 0 0 20px; font-size: 16px; line-height: 1.4; }
.insights .n { font: 400 12px/1 var(--mono); display: block; margin-bottom: 6px; }
.insights h3 { display: inline; font: 600 16px/1.4 var(--sans); margin: 0; }
.insights h3::after { content: " "; }
.insights li p { display: inline; margin: 0; }
.insights b { font-weight: 500; font-variant-numeric: tabular-nums; }
/* "Visão sem filtros": shown only while a filter is on, next to copy computed for the default view */
.scope-note { display: none; font: 400 13px/1.4 var(--sans); color: var(--muted); margin: 0 0 8px; letter-spacing: 0; }
.scope-note b { display: inline-block; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .03em; color: var(--ink); border: var(--rule-w) solid var(--rule-strong); border-radius: 999px; padding: 4px 8px 3px; margin-right: 6px; vertical-align: 1px; }
html.filtered .scope-note { display: block; }
.band .dek .scope-note { margin: 12px 0 0; }
html:not(.layout-clean) .band .scope-note { color: var(--hero-muted); } html:not(.layout-clean) .band .scope-note b { color: var(--hero-ink); border-color: var(--hero-rule); }
.insights .scope { font-size: 13px; color: var(--hero-muted); margin: 8px 0 0; }

/* Filter bar (sticky under the header; slides up with it) ---------------- */
.filterbar {
  position: sticky; top: var(--hdr-h); z-index: 40; background: var(--bg);
  border-bottom: var(--rule-w) solid var(--rule); transition: top calc(.5s * var(--mk)) var(--ease-out), background-color calc(.3s * var(--mk)) var(--ease-io);
}
html.hdr-hidden .filterbar { top: 0; }
.filterbar .inner { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px var(--pad); flex-wrap: wrap; }
.fb-label { font: 400 12px/1 var(--mono); text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { border: 1px solid transparent; background: transparent; padding: 0 12px; height: 32px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: background var(--t-hover) ease, color var(--t-hover) ease; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dd { position: relative; }
.dd > button { height: 32px; padding: 0 12px; border-radius: 999px; border: var(--rule-w) solid var(--rule); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; transition: border-color var(--t-hover) ease; }
.dd > button:first-child:hover, .dd.open > button:first-child { border-color: var(--ink); }
.dd > button .count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; padding: 2px 7px; font-weight: 500; }
.dd > button .count[hidden] { display: none; }
.dd > button svg { width: 12px; height: 12px; opacity: .6; transition: transform calc(.3s * var(--mk)) var(--ease-out); }
.dd.open > button svg { transform: rotate(180deg); }
.dd.active > button:first-child { border-color: var(--ink); }
.dd.daterange > button { font-variant-numeric: tabular-nums; }
.panel { position: absolute; top: calc(100% + 8px); left: 0; width: 280px; max-height: 380px; display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--ink); overflow: hidden; animation: pop calc(.35s * var(--mk)) var(--ease-out); }
.dd.open .panel { display: flex; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
.panel input[type=search] { margin: 10px; padding: 8px 10px; border: var(--rule-w) solid var(--rule); background: var(--bg); font-size: 14px; border-radius: 0; }
.panel .opts { overflow: auto; padding: 0 0 6px; }
.panel label { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer; transition: background var(--t-hover) ease; }
.panel label:hover { background: var(--surface-2); }
.panel label .n { margin-left: auto; color: var(--muted); font: 400 12px/1 var(--mono); }
.panel input[type=checkbox] { accent-color: var(--ink); width: 14px; height: 14px; }
.panel .foot { display: flex; justify-content: space-between; padding: 10px 12px; border-top: var(--rule-w) solid var(--rule); font-size: 13px; }
.panel .foot button { border: 0; background: none; cursor: pointer; font-weight: 500; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.dd.daterange .panel { padding: 12px; gap: 10px; }
.dd.daterange label { display: grid; gap: 6px; font: 400 12px/1 var(--mono); text-transform: uppercase; color: var(--muted); padding: 0; }
.dd.daterange label:hover { background: none; }
.dd.daterange input { border: var(--rule-w) solid var(--rule); background: var(--bg); padding: 8px 9px; font: 400 14px/1 var(--sans); text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
[data-theme="dark"] .dd.daterange input { color-scheme: dark; }
.dd.daterange .apply { height: 34px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: 14px; cursor: pointer; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.dd > button .dd-v { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
.dd.active > button:first-child { padding-right: 34px; }
.dd > button .dd-v { margin-left: -7px; }
.dd > .dd-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1; padding: 0; }
.dd > .dd-x:hover { background: var(--surface-2); color: var(--ink); }
.dd > .dd-x[hidden] { display: none; }

#filterbar { transition: min-height calc(.18s * var(--mk)) var(--ease-out); }
.section-head h2:focus, .section-head h2:focus-visible { outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
@media (min-width: 701px) { .filterbar .chips { display: none; } }   /* desktop: the value lives in its dropdown (M2) */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 500; border: 0; cursor: pointer; animation: pop calc(.35s * var(--mk)) var(--ease-out); }
.chip i { font-style: normal; font-weight: 400; }
.chip i::after { content: ":"; }
.chip span.x { width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 50%; transition: background var(--t-hover) ease; }
.chip:hover span.x { background: color-mix(in srgb, var(--accent-ink) 14%, transparent); }
.fb-right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.fb-right .count-txt { font: 400 12px/1 var(--mono); }
.linkbtn { border: 0; background: none; color: var(--ink); cursor: pointer; font-weight: 500; font-size: 14px; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn[hidden] { display: none; }

/* Sticky chapter TOC (left): a hairline rail, the active chapter gets a primary-color bar */
/* sits in the reserved rail: same left edge as the page padding, never wider than the rail */
/* Hidden while the header zone is on screen; fades + slides in when the first section reaches it (initTocReveal,
   IntersectionObserver) and leaves again at the top. Its height is capped so it stays clear of the sticky
   header + filter bar (--fb-h is measured). Hidden = visibility:hidden + inert + aria-hidden. */
.toc { position: fixed; left: calc(max(0px, (100vw - var(--maxw)) / 2) + var(--pad)); top: 50%; z-index: 30; width: var(--rail);
  max-height: calc(100vh - 2 * (var(--hdr-h) + var(--fb-h, 56px)) - 32px); overflow-y: auto;
  opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-14px, -50%);
  transition: opacity calc(.45s * var(--mk)) var(--ease-out), transform calc(.45s * var(--mk)) var(--ease-out), visibility 0s linear calc(.45s * var(--mk)); }
.toc.on { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(0, -50%); transition-delay: 0s; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc ol { border-left: var(--rule-w) solid var(--rule); }
.toc a { display: block; text-decoration: none; font-size: 13.5px; line-height: 1.35; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); letter-spacing: -.005em; transition: color calc(.2s * var(--mk)) var(--ease-io), border-color calc(.25s * var(--mk)) var(--ease-io); }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--ink); font-weight: 500; border-left-color: var(--primary); }
.toc .prog { margin-top: 10px; height: 1px; background: var(--rule); position: relative; overflow: hidden; }
.toc .prog i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform calc(.2s * var(--mk)) linear; }
@media (max-width: 1099px) { .toc { display: none; } }

/* Sections & charts ----------------------------------------------------- */
.section { padding-top: clamp(calc(var(--sp-section) * .53px), calc(var(--sp-section) * .0667vw), calc(var(--sp-section) * 1px)); }
.section .sec-rule { grid-column: content; border-top: var(--rule-section-w) solid var(--rule-strong); margin-bottom: 18px; }
.section .sec-kicker { grid-column: content; padding: 0 0 12px; }
.section-head { margin-bottom: 44px; }
.section-head h2 { font: var(--hw) clamp(calc(var(--fs-h2) * .75px), calc(var(--fs-h2) * .07vw), calc(var(--fs-h2) * 1px))/1.1 var(--heading); letter-spacing: calc(-.04em * var(--track)); margin: 0; text-wrap: balance; }
.section-head .q { font-size: 20px; line-height: 1.3; letter-spacing: -.02em; color: var(--muted); margin: 14px 0 0; }
.section-head .lede { margin: 28px 0 0; font-size: 16px; line-height: 1.4; max-width: 34em; text-wrap: pretty; }
.section-head .lede b { font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: calc(var(--sp-chart) * 1px) var(--gutter); }
/* width full | half | third → span 12 | 6 | 4; layoutGrid() packs rows, widens orphans and adapts per breakpoint */
.chart { margin: 0; grid-column: span 12; min-width: 0; display: flex; flex-direction: column; }
.chart.half { grid-column: span 6; } .chart.third { grid-column: span 4; }
.chart > .note { margin-top: auto; padding-top: 12px; }
.chart.is-empty { order: 99; }
.chart figcaption { border-bottom: var(--rule-strong-w) solid var(--rule-strong); padding-bottom: 14px; }
.chart figcaption h3 { font: var(--hw) calc(var(--fs-chart) * 1px)/1.05 var(--heading); letter-spacing: calc(-.04em * var(--track)); margin: 0; max-width: 70%; text-wrap: balance; }
.chart.half figcaption h3, .chart.third figcaption h3 { max-width: 92%; }
.chart figcaption p { margin: 10px 0 0; font-size: 14px; line-height: 1.35; color: var(--muted); max-width: 46em; }
.chart .viz { margin-top: 14px; position: relative; min-height: 60px; }
.chart .viz svg { overflow: visible; }
.chart .note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.empty { padding: 28px 0; color: var(--muted); font-size: 14px; }
/* a chart emptied by the filters collapses to one quiet line (no empty box); its subtitle, note and question fold away */
.chart.is-empty .viz { min-height: 0; margin-top: 10px; }
.chart.is-empty .viz .empty { padding: 4px 0 2px; font: 400 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
.chart.is-empty figcaption p, .chart.is-empty .note, .chart.is-empty .viz > :not(.empty) { display: none; }
/* survey question, verbatim from the data: wraps, never truncated */
.chart figcaption p.question { color: var(--ink); white-space: normal; overflow-wrap: anywhere; max-width: 60em; }
.chart figcaption p.question .qk, .kpi-q .qk { font: 400 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); margin-right: 8px; }
/* single interaction help (filter bar) */
.help { position: relative; }
.help > button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; cursor: pointer; font: 400 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
.help > button:hover, .help > button[aria-expanded="true"] { color: var(--ink); }
.help > button .qm { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: var(--rule-w) solid currentColor; font-size: 11px; text-transform: none; }
.help-pop { position: absolute; right: 0; top: calc(100% + 10px); z-index: 60; width: min(340px, 86vw); background: var(--surface); color: var(--ink); border: var(--rule-w) solid var(--rule); border-radius: var(--radius, 10px); box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 14px 16px; font-size: 14px; line-height: 1.4; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity calc(.18s * var(--mk)) ease, transform calc(.18s * var(--mk)) ease; }
.help-pop.on { opacity: 1; transform: none; pointer-events: auto; }
.help-pop h4 { margin: 0 0 8px; font: 400 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
.help-pop ul { margin: 0; padding-left: 18px; } .help-pop li { margin: 0 0 6px; }
.fade { animation: fadein calc(.3s * var(--mk)) ease; }
@keyframes fadein { from { opacity: .3; } }

/* Reveal states. JS adds .in when a block scrolls into view (once). */
.rv { opacity: 0; transform: translateY(24px); transition: opacity calc(.9s * var(--mk)) var(--ease-out), transform calc(.9s * var(--mk)) var(--ease-out); }
.rv.in { opacity: 1; transform: none; }
.chart figcaption { transition: opacity calc(.7s * var(--mk)) var(--ease-out), transform calc(.7s * var(--mk)) var(--ease-out); }
.chart:not(.in) figcaption { opacity: 0; transform: translateY(16px); }
/* Plot SVG entry: lines/areas wipe in, bars grow from the baseline, dots pop, cells and labels fade */
.chart svg [aria-label="line"], .chart svg [aria-label="area"] { clip-path: inset(-24px -24px -24px -24px); transition: clip-path calc(1.5s * var(--mk)) var(--ease-out) calc(.15s * var(--mk)); }
.chart:not(.in) svg [aria-label="line"], .chart:not(.in) svg [aria-label="area"] { clip-path: inset(-24px 100% -24px -24px); }
.chart svg [aria-label="bar"] rect, .chart svg [aria-label="rect"] rect { transform-box: fill-box; transform-origin: left center; transition: transform var(--t-bar) var(--ease-out) var(--d, calc(0ms * var(--mk))); }
.chart svg [aria-label="rect"] rect { transform-origin: center bottom; }
.chart svg [aria-label="bar"] rect.neg { transform-origin: right center; }
.chart:not(.in) svg [aria-label="bar"] rect { transform: scaleX(0); }
.chart:not(.in) svg [aria-label="rect"] rect { transform: scaleY(0); }
.chart svg [aria-label="dot"] circle { transform-box: fill-box; transform-origin: center; transition: transform calc(.7s * var(--mk)) var(--ease-out) var(--d, calc(0ms * var(--mk))); }
.chart:not(.in) svg [aria-label="dot"] circle { transform: scale(0); }
.chart svg [aria-label="cell"] rect { transition: opacity calc(.6s * var(--mk)) ease var(--d, calc(0ms * var(--mk))); }
.chart:not(.in) svg [aria-label="cell"] rect { opacity: 0; }
.chart svg [aria-label="text"], .chart svg [aria-label="rule"] { transition: opacity var(--t-fade) ease calc(.75s * var(--mk)); }
.chart:not(.in) svg [aria-label="text"], .chart:not(.in) svg [aria-label="rule"] { opacity: 0; }
.chart svg [aria-label*="axis"], .chart svg [aria-label*="grid"] { transition: opacity calc(.6s * var(--mk)) ease; }
.chart:not(.in) svg [aria-label*="axis"], .chart:not(.in) svg [aria-label*="grid"] { opacity: 0; }
.chart svg [aria-label="tip"] text, .chart svg [aria-label="tip"] tspan { fill: var(--tip-ink); }

/* HTML bar list — label above a flat 16px bar, value riding the bar end */
.bars { display: grid; }
.bar { display: block; width: 100%; padding: 12px 0 0; margin: 0; border: 0; background: none; text-align: left; cursor: pointer; position: relative; transition: background var(--t-hover) ease; }
.bar::before { content: ""; position: absolute; inset: 0; background: var(--surface-2); opacity: 0; transition: opacity var(--t-hover) ease; z-index: -1; }
.bars { position: relative; z-index: 0; }
.bar:hover::before { opacity: 1; }
.bar .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; min-width: 0; }
.bar .lbl { font-size: 15px; font-weight: 500; letter-spacing: -.015em; white-space: normal; overflow-wrap: anywhere; min-width: 0; transition: color var(--t-hover) ease; }   /* wraps: never cut with … */
.bar .dl { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar .track { display: block; position: relative; height: 16px; padding-right: 116px; }
.bar .track::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-bottom: var(--rule-w) solid var(--rule); }
.bar .lane { display: block; position: relative; height: 100%; }
.bar .fill { position: absolute; top: 0; bottom: 0; left: 0; width: var(--w); background: var(--accent); z-index: 1; transition: width var(--t-bar) var(--ease-out) var(--d, calc(0ms * var(--mk))), background var(--t-hover) ease; }
.chart:not(.in) .bar .fill { width: 0; }
.bar .val { position: absolute; z-index: 3; left: calc(max(var(--w), var(--p, 0%)) + 8px); top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.02em; transition: opacity var(--t-fade) ease calc(var(--d, calc(0ms * var(--mk))) + calc(520ms * var(--mk))); }
.bar .val small { color: var(--muted); margin-left: 6px; font-size: 13px; font-weight: 400; }
.chart:not(.in) .bar .val { opacity: 0; }
.bar .prev { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); z-index: 2; transition: opacity var(--t-fade) ease calc(.6s * var(--mk)); }
.chart:not(.in) .bar .prev { opacity: 0; }
.bars.has-sel .bar:not(.sel) .fill { background: var(--context); }
.bars.has-sel .bar:not(.sel) .lbl { color: var(--muted); }
.bar.other { cursor: default; } .bar.other .fill { background: var(--context); } .bar.other .lbl { color: var(--muted); }
.bar.other:hover::before { opacity: 0; }
.legend-inline { display: flex; gap: 8px 20px; font-size: 14px; margin-bottom: 4px; flex-wrap: wrap; align-items: center; }
.legend-inline i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 8px; }
.legend-inline i.tick { width: 2px; height: 14px; background: var(--ink); }

/* Columns — big numbers over tall flat columns (company-size style) */
.viz .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); height: var(--hgt, 360px); }
.col { overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 0; margin: 0; border: 0; border-left: var(--rule-w) solid var(--rule); background: none; text-align: left; cursor: pointer; min-width: 0; }
.col .lbl { position: absolute; top: 0; left: 10px; right: 6px; font-size: 15px; font-weight: 500; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col .num { font: var(--hw) var(--num, 48px)/1 var(--heading); letter-spacing: calc(-.045em * var(--track)); padding: 0 0 8px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity var(--t-fade) ease calc(var(--d, calc(0ms * var(--mk))) + calc(520ms * var(--mk))); }
.col .num small { display: block; font: 400 13px/1.2 var(--sans); letter-spacing: 0; color: var(--muted); margin-top: 6px; }
.col .fill { height: var(--h); background: var(--accent); margin-right: 3px; transition: height var(--t-bar) var(--ease-out) var(--d, calc(0ms * var(--mk))), background var(--t-hover) ease; }
.chart:not(.in) .col .fill { height: 0; }
.chart:not(.in) .col .num { opacity: 0; }
.col.other { cursor: default; } .col.other .fill { background: var(--context); } .col.other .lbl { color: var(--muted); }
.cols.wrapnum .col .num { white-space: normal; padding-right: 4px; }
.cols.wrapnum .col .num small { font-size: 11px; }
.col:not(.other):hover .fill { background: color-mix(in srgb, var(--accent) 82%, var(--ink)); }
.cols.has-sel .col:not(.sel) .fill { background: var(--context); }
.cols.has-sel .col:not(.sel) .num { color: var(--muted); }

/* Part-to-whole strip (use instead of pies) */
.share .pcts { position: relative; height: 20px; font-size: 13px; font-variant-numeric: tabular-nums; }
.share .pcts span { position: absolute; bottom: 4px; white-space: nowrap; transition: opacity var(--t-fade) ease calc(calc(.6s * var(--mk)) + var(--d, calc(0ms * var(--mk)))); }
.chart:not(.in) .share .pcts span { opacity: 0; }
.share .strip { display: flex; height: 120px; clip-path: inset(0 0 0 0); transition: clip-path calc(1.2s * var(--mk)) var(--ease-out); }
.chart:not(.in) .share .strip { clip-path: inset(0 100% 0 0); }
.share .seg-s { min-width: 2px; cursor: pointer; transition: opacity var(--t-hover) ease, filter var(--t-hover) ease; }
.share .seg-s:hover { filter: brightness(.94); }
.share.has-sel .seg-s:not(.sel), .share.has-sel .labels div:not(.sel), .share.has-sel .pcts span:not(.sel) { opacity: .28; }
.share .labels { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; }
.share .labels div { font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: opacity var(--t-hover) ease; }
.share .labels i { width: 14px; height: 14px; flex: none; }
.share .labels small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Small multiples */
.multiples { display: grid; gap: 36px 28px; }
.multiple { border-top: var(--rule-w) solid var(--rule); padding-top: 10px; transition: opacity var(--t-hover) ease; }
.multiple h4 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.015em; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.multiple h4 span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.multiple .ch { font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.multiples.has-sel .multiple:not(.sel) { opacity: .35; }

/* Survey charts (likert · nps · themes) ----------------------------------- */
.small-badge { font: 400 10.5px/1 var(--mono); font-style: normal; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--muted); padding: 3px 5px; white-space: nowrap; border-radius: var(--radius); }
.legend-inline i.dot { width: 11px; height: 11px; border-radius: 50%; border: 1.25px solid var(--ink); }
.legend-inline i.dot.hollow { background: var(--bg); border: 1.25px dashed var(--muted); }
.legend-inline i.ci-band { opacity: .35; width: 22px; height: 12px; }
.legend-inline i.hatch { opacity: .55; background-image: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--bg) 70%, transparent) 4px 6px); }
.sig-legend { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
/* after the first entry, filter updates are quick and unstaggered: 240 ms (B6) */
html.live { --t-bar: clamp(0ms, calc(240ms * var(--mk) * 1000), 240ms); }
html.live .bar .fill, html.live .col .fill, html.live .lk-side, html.live .th-share i { transition-timing-function: cubic-bezier(.23, 1, .32, 1); }
html.live .chart.in [style*="--d"] { --d: 0ms !important; }
.lk, .np, .th { display: grid; position: relative; z-index: 0; }
.lk-legend { margin-bottom: 12px; }
.lk-row, .np-row { display: grid; grid-template-columns: minmax(0, 26%) minmax(0, 1fr); align-items: center; gap: 16px; padding: 9px 0; border: 0; border-bottom: var(--rule-w) solid var(--rule); background: none; text-align: left; width: 100%; cursor: pointer; position: relative; color: inherit; }
.np-row { grid-template-columns: minmax(0, 26%) minmax(0, 1fr) 104px; }
.lk-row::before, .np-row::before { content: ""; position: absolute; inset: 0; background: var(--surface-2); opacity: 0; transition: opacity var(--t-hover) ease; z-index: -1; }
button.lk-row:hover::before, button.np-row:hover::before { opacity: 1; }
.lk-row.all, .np-row.all { cursor: default; border-bottom: var(--rule-strong-w) solid var(--rule-strong); padding: 12px 0; }
.lk-row.all .lbl, .np-row.all .lbl { font-weight: 600; }
.lk-lab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.lk-lab .lbl { font-size: 15px; font-weight: 500; letter-spacing: -.015em; white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
.lk-lab .n { font: 400 12px/1.2 var(--mono); color: var(--muted); }
.lk-bar { position: relative; height: 24px; display: block; }
.lk-track { position: absolute; left: 44px; right: 44px; top: 0; bottom: 0; }
.lk-track::after { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; border-left: 1.25px solid var(--ink); }
.lk-side { position: absolute; top: 0; bottom: 0; display: flex; transition: transform var(--t-bar) var(--ease-out) var(--d, 0ms); }
.lk-side.neg { right: 50%; transform-origin: right center; }
.lk-side.pos { left: 50%; transform-origin: left center; }
.chart:not(.in) .lk-side { transform: scaleX(0); }
.lk-side i, .np-bar i, .th-bands i { display: flex; align-items: center; justify-content: center; font: 500 12px/1 var(--sans); font-style: normal; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; white-space: nowrap; }
.lk-side.neg i:first-child { border-radius: var(--radius) 0 0 var(--radius); } .lk-side.pos i:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.lk-tot { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity var(--t-fade) ease calc(var(--d, 0ms) + 520ms * var(--mk)); }
.chart:not(.in) .lk-tot { opacity: 0; }
.lk.has-sel .lk-row:not(.sel):not(.all), .np.has-sel .np-row:not(.sel):not(.all), .th.has-sel .th-row:not(.sel) { opacity: .4; }
/* small samples: always shown, drawn lighter and hatched, with a badge */
.lk-row.small .lk-side, .np-row.small .np-bar, .th-row.small .th-bands { opacity: .55; }
.lk-row.small .lk-track::before, .np-row.small .np-bar::after, .th-row.small .th-bands::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--bg) 70%, transparent) 4px 6px); }
.np-bar { position: relative; display: flex; height: 24px; border-radius: var(--radius); overflow: hidden; clip-path: inset(0 0 0 0); transition: clip-path calc(1.1s * var(--mk)) var(--ease-out) var(--d, 0ms); }
.chart:not(.in) .np-bar { clip-path: inset(0 100% 0 0); }
.np-val { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.np-val b { font: var(--hw) 26px/1 var(--heading); letter-spacing: calc(-.04em * var(--track)); }
.np-val small { font-size: 12px; color: var(--muted); }
.np-mark { font-size: 12px; }
.th-head, .th-main { display: grid; grid-template-columns: minmax(0, 32%) minmax(0, 22%) minmax(0, 1fr) 76px; gap: 16px; align-items: center; }
.th-head { font: 400 12px/1.2 var(--mono); text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: var(--rule-strong-w) solid var(--rule-strong); }
.th-head .r { text-align: right; }
.th > .legend-inline { margin: 0 0 12px; font-size: 13px; }
.th-ml { display: none; font: 400 11px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .02em; grid-column: 1 / -1; margin-bottom: -4px; }
.th-row { border-bottom: var(--rule-w) solid var(--rule); padding: 12px 0; position: relative; transition: opacity var(--t-hover) ease; }
.th-row.other .th-name b { color: var(--muted); font-weight: 500; }
.th-main { width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; position: relative; }
.th-main::before { content: ""; position: absolute; inset: -6px 0; background: var(--surface-2); opacity: 0; transition: opacity var(--t-hover) ease; z-index: -1; }
.th-main:hover::before { opacity: 1; }
.th-name { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; }
.th-name b { font: var(--hw) 17px/1.2 var(--heading); letter-spacing: calc(-.02em * var(--track)); }
.th-name small { font-size: 12.5px; color: var(--muted); }
.th-count { display: grid; gap: 5px; }
.th-share { display: block; height: 8px; background: var(--surface-2); position: relative; overflow: hidden; border-radius: var(--radius); }
.th-share i { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width var(--t-bar) var(--ease-out) var(--d, 0ms); }
.chart:not(.in) .th-share i { width: 0 !important; }
.th-count .num { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; } .th-count .num small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.th-bands { position: relative; display: flex; height: 22px; border-radius: var(--radius); overflow: hidden; clip-path: inset(0 0 0 0); transition: clip-path calc(1.1s * var(--mk)) var(--ease-out) var(--d, 0ms); }
.chart:not(.in) .th-bands { clip-path: inset(0 100% 0 0); }
.th-val { text-align: right; font: var(--hw) 20px/1 var(--heading); font-variant-numeric: tabular-nums; display: flex; justify-content: flex-end; align-items: baseline; gap: 5px; }
.th-quotes { list-style: none; margin: 10px 0 0; padding: 0 0 0 calc(32% + 16px); display: grid; gap: 6px; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.th-quotes li { font-style: italic; } .th-quotes small { font-style: normal; color: var(--muted); font-size: 12px; }
.th-note { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; }
/* KPI CI line + table significance markers */
.kpi .kci { order: 4; margin-top: 6px; font: 400 12px/1.3 var(--mono); color: var(--hero-muted); letter-spacing: .01em; }
.kpi svg.spark { order: 5; }
.kpi.small .value { opacity: .7; }
table.data .tsig { font-size: 10px; margin-left: 3px; } table.data .tsig.good { color: var(--pos-ink); } table.data .tsig.bad { color: var(--neg-ink); }
table.data td.ci { color: var(--muted); font-size: 13.5px; }
table.data tr.small td { color: var(--muted); }
#tt .warn { color: color-mix(in srgb, var(--tip-ink) 85%, transparent); font-size: 12.5px; }
@media (max-width: 700px) {
  .lk-row, .np-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .np-row { grid-template-columns: minmax(0, 1fr) auto; } .np-row .lk-lab { grid-column: 1 / -1; }
  .lk-track { left: 34px; right: 34px; }
  .th-head { display: none; } .th-ml { display: block; }
  .th-main { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
  .th-name { grid-column: 1 / -1; } .th-count { grid-column: 1 / -1; } .th-bands { grid-column: 1; }
  .th-quotes { padding-left: 0; }
}

/* Floating tooltip for HTML charts — ink slab, inverted text, theme radius */
#tt { position: fixed; z-index: 80; pointer-events: none; opacity: 0; transform: translateY(6px); background: var(--tip-bg); color: var(--tip-ink); padding: 10px 12px; font-size: 14px; line-height: 1.4; letter-spacing: -.01em; max-width: 280px; transition: opacity calc(.2s * var(--mk)) ease, transform calc(.3s * var(--mk)) var(--ease-out); font-variant-numeric: tabular-nums; left: 0; top: 0; }
#tt.on { opacity: 1; transform: none; }
#tt b { font-weight: 500; }
#tt .k { opacity: .65; }

/* Data table ------------------------------------------------------------ */
#table-section .table-tools, #table-section .tscroll, #table-section .pager { grid-column: content; }
.table-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.table-tools input[type=search], .table-tools select { height: 36px; border: var(--rule-w) solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0 14px; font-size: 14px; transition: border-color var(--t-hover) ease; }
.table-tools input[type=search]:hover, .table-tools select:hover, .table-tools input[type=search]:focus { border-color: var(--ink); outline: none; }
.table-tools input[type=search]:focus-visible, .table-tools select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.table-tools input[type=search] { min-width: 200px; flex: 1 1 220px; max-width: 340px; }
.table-tools .spacer { flex: 1; }
.pill { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background var(--t-hover) ease, color var(--t-hover) ease; }
.pill:hover, .pill.solid { background: var(--ink); color: var(--bg); }
.pill.solid:hover { opacity: .85; }
.tscroll { overflow-x: auto; border-top: var(--rule-strong-w) solid var(--rule-strong); -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font: 400 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); padding: 12px 12px; border-bottom: var(--rule-w) solid var(--rule); white-space: nowrap; cursor: pointer; user-select: none; background: var(--bg); transition: color calc(.2s * var(--mk)) var(--ease-io); }
table.data th:hover { color: var(--ink); }
table.data th.num, table.data td.num { text-align: right; }
table.data th .th-b { all: unset; cursor: pointer; display: inline-flex; align-items: center; position: relative; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
table.data th .th-b:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
/* the arrow takes no width: headers don't shift when the sort moves (M4) */
table.data th .arr { opacity: 0; position: absolute; left: calc(100% + 3px); width: 0; overflow: visible; }
table.data th.num .arr { left: auto; right: calc(100% + 3px); } table.data th.sorted { color: var(--ink); } table.data th.sorted .arr { opacity: 1; }
table.data td { padding: 10px 12px; border-bottom: var(--rule-w) solid var(--rule); white-space: nowrap; transition: background var(--t-hover) ease; }
table.data tbody tr:hover td { background: var(--surface-2); }
table.data td.bar-cell { position: relative; }
/* data bar = thin line under the number: no translucent block behind the text (M5) */
table.data td.bar-cell .db { position: absolute; right: 12px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--accent); opacity: .55; pointer-events: none; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.pager button { border: var(--rule-w) solid var(--rule); background: var(--surface); border-radius: 999px; height: 32px; padding: 0 14px; cursor: pointer; font-size: 14px; transition: border-color var(--t-hover) ease; }
.pager button:hover:not(:disabled) { border-color: var(--ink); }
.pager button:disabled { opacity: .35; cursor: default; }

/* Methodology — black footer -------------------------------------------- */
.method { margin-top: clamp(80px, 10vw, 140px); padding: 28px 0 72px; background: var(--footer-bg); color: var(--footer-ink); }
.method .g > .kicker { grid-column: content; border-bottom: 1px solid color-mix(in srgb, var(--footer-ink) 35%, transparent); padding-bottom: 14px; margin-bottom: 28px; }
.method .acc { grid-column: content; }
.method summary { list-style: none; display: flex; align-items: center; gap: 14px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--footer-ink) 35%, transparent); padding: 6px 0 14px; }
.method summary::-webkit-details-marker { display: none; }
.method summary .kicker { margin: 0; color: var(--footer-ink); }
.method summary .acc-state { margin-left: auto; font: 400 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; color: color-mix(in srgb, var(--footer-ink) 62%, transparent); }
.method summary .chev { display: inline-flex; width: 14px; height: 14px; color: color-mix(in srgb, var(--footer-ink) 62%, transparent); transition: transform calc(.25s * var(--mk)) ease; }
.method summary .chev svg { width: 14px; height: 14px; }
.method details[open] summary .chev { transform: rotate(180deg); }
.method summary:hover .acc-state, .method summary:hover .chev { color: var(--footer-ink); }
.method summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.method .acc-in { padding-top: 28px; }
.method dd .mq { display: block; margin-top: 4px; color: var(--footer-ink); }
.method dd .mq .qk { font: 400 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; margin-right: 8px; color: color-mix(in srgb, var(--footer-ink) 62%, transparent); }
.method .cols { grid-column: content; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px var(--gutter); }
.method .cols > * { grid-column: span 4; min-width: 0; }
.method h4 { font: 400 12px/1 var(--mono); letter-spacing: .02em; text-transform: uppercase; color: color-mix(in srgb, var(--footer-ink) 62%, transparent); margin: 0 0 16px; }
.method ul { margin: 0; padding-left: 18px; font-size: 15px; }
.method li { margin-bottom: 8px; }
.method dl { margin: 0; font-size: 15px; }
.method dt { font-weight: 500; } .method dd { margin: 0 0 12px; color: color-mix(in srgb, var(--footer-ink) 75%, transparent); }
.method .colophon { grid-column: content; margin-top: 48px; font-size: 13px; color: color-mix(in srgb, var(--footer-ink) 62%, transparent); }
.method .bigmark { grid-column: content; font: var(--hw) clamp(calc(var(--fs-hero) * .4px), calc(var(--fs-hero) * .0695vw), calc(var(--fs-hero) * 1px))/var(--lh-hero) var(--heading); letter-spacing: calc(-.06em * var(--track)); margin: 64px 0 0; color: var(--footer-ink); }

/* Responsive ------------------------------------------------------------ */
@media (max-width: 1099px) {
  :root { --pad: 20px; }
  .g { grid-template-columns: [full-start] var(--pad) [wide-start content-start] minmax(0, 1fr) [content-end wide-end] var(--pad) [full-end]; }
  .band .dek, .band #kpis, .band #insights, .section .sec-kicker, .section-head { grid-row: auto; }
  .band .dek { margin: 0 0 32px; }
  .section .sec-kicker { padding: 0 0 16px; }
  .section-head { margin-bottom: 36px; }
  .hdr { grid-template-columns: auto 1fr auto; }
  .art { grid-template-columns: 1fr; } .art .art-r { display: none; }
}
@media (max-width: 700px) {
  body { font-size: 15px; --gutter: 16px; }   /* narrower gutter on phones (KPI pairs) */
  .hdr .seg-o .navbtn .long { display: none; } .hdr .seg-o .navbtn .short { display: inline; }
  .hdr .brand { min-width: 0; font-size: 16px; }
  .hdr .brand .badge { display: none; }

  .hdr .nav { gap: 18px; }

  .hero .byline { flex-direction: column; justify-content: flex-start; gap: 2px; }
  .navbtn { font-size: 16px; }
  .hero .g { min-height: 62svh; }
  .kpi { padding: 10px 10px 14px 12px; }
  .kpi .value { margin-bottom: 18px; }
  .kpi .label { font-size: 18px; }
  .kpi .delta { font-size: 13px; }
  .filterbar .inner { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filterbar .inner::-webkit-scrollbar { display: none; }
  .filterbar .inner > * { flex: none; }

  .help-pop { position: fixed; left: 12px; right: 12px; top: auto; width: auto; }
  .panel { position: fixed; left: 12px; right: 12px; top: 120px; width: auto; }
  .chart figcaption h3 { font-size: 20px; max-width: none; }
  .bar .track { padding-right: 92px; }
  .bar .val small { display: none; }
  .viz .cols { --hgt: 280px; }
  /* phones: the name sits above the column (not over the number), numbers compact without decimals */
  .col { justify-content: flex-start; }
  .col .lbl { position: static; padding: 0 6px 4px; white-space: normal; overflow: visible; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; min-height: calc(2.4em + 4px); }   /* two lines reserved: numbers line up across columns */
  .col .fill { margin-top: auto; }
  .col .num { white-space: normal; padding-left: 6px; padding-right: 2px; }
  .col .num small { font-size: 11px; white-space: normal; }
  .share .strip { height: 80px; }
  .table-tools input[type=search] { max-width: none; }
  .grid { row-gap: 64px; }
  /* first column stays put while the table scrolls sideways (M6) */
  table.data th:first-child, table.data td:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); box-shadow: inset -1px 0 0 var(--rule); }
  table.data tbody tr:hover td:first-child { background: var(--surface-2); }
  /* touch targets ≥ 44px on phones (M11) */
  .hdr .nav .navbtn, .help > button, #menu-close { min-width: 44px; min-height: 44px; justify-content: center; }
  .hdr .nav { gap: 4px; }
  .dd.active > button:first-child { padding-right: 38px; }

}


/* Theme options ---------------------------------------------------------- */
.bar .fill { border-radius: 0 var(--radius) var(--radius) 0; }
.col .fill { border-radius: var(--radius) var(--radius) 0 0; }
.share .strip { border-radius: var(--radius); overflow: hidden; }
.panel, #tt, .kpi-grid { border-radius: var(--radius); }
/* hero.style = "plain": no full-bleed color; the primary color becomes a thick top rule + kicker color */
html.hero-plain { --hero: var(--bg); --hero-ink: var(--ink); --hero-muted: var(--muted); --hero-rule: var(--rule-strong); }
html.hero-plain .hero .kicker { color: var(--primary-text); }
html.hero-plain .band .rule { border-top: 4px solid var(--primary); }

/* layout.style = "clean" (default theme "Neutro"): plain hero on the page color, KPI cards, light footer.
   Everything here only re-styles the shared markup; "blocks" keeps the full-bleed color hero + band. */
html.layout-clean { --hero: var(--bg); --hero-ink: var(--ink); --hero-muted: var(--muted); --hero-rule: var(--rule); }
html.layout-clean .hero { padding-top: calc(var(--hdr-h) + clamp(28px, 4vw, 64px)); }
html.layout-clean .hero .g { min-height: 0 !important; padding-bottom: clamp(24px, 3vw, 40px); align-content: start; }
html.layout-clean .hero .kicker { color: var(--primary-text); font-weight: 500; margin-bottom: 16px; }
html.layout-clean .hero h1.title { font: var(--hw) clamp(calc(var(--fs-hero) * .58px), calc(var(--fs-hero) * .0695vw), calc(var(--fs-hero) * 1px))/var(--lh-hero) var(--heading); letter-spacing: calc(-.05em * var(--track)); max-width: 21em; }
html.layout-clean .hero .byline { justify-content: flex-start; gap: 4px 20px; margin-top: 20px; font-size: 13.5px; }
html.layout-clean .hero .byline b { font-weight: 500; }
html.layout-clean .hero .kicker, html.layout-clean .hero h1.title, html.layout-clean .hero .byline { transition: opacity calc(.6s * var(--mk)) var(--ease-out), transform calc(.6s * var(--mk)) var(--ease-out); }
html.layout-clean .hero h1.title { transition-delay: calc(.06s * var(--mk)); } html.layout-clean .hero .byline { transition-delay: calc(.12s * var(--mk)); }
html.layout-clean.intro .hero .kicker, html.layout-clean.intro .hero h1.title, html.layout-clean.intro .hero .byline { opacity: 0; transform: translateY(10px); }
html.layout-clean .band { padding: clamp(28px, 3vw, 44px) 0 calc(var(--sp-band) * 1px); }
html.layout-clean .band .rule { display: none; }
html.layout-clean .band .dek { grid-column: wide; grid-row: 1; font: 400 calc(var(--fs-dek) * 1px)/1.5 var(--sans); letter-spacing: -.005em; color: var(--ink-2); max-width: 46em; margin: 0 0 28px; }
html.layout-clean .band .dek b { font-weight: 600; }
html.layout-clean .band #kpis { grid-column: wide; grid-row: 2; }
html.layout-clean .band #insights { grid-column: wide; grid-row: 3; padding-top: 40px; }
html.layout-clean .kpi-grid { gap: 16px var(--gutter); border: 0; border-radius: 0; }
html.layout-clean .kpi, html.layout-clean .kpi.t { background: var(--surface); border: var(--rule-w) solid var(--rule); border-radius: var(--radius); padding: 16px 18px 14px; box-shadow: 0 1px 2px rgba(15, 20, 25, .04); transition: border-color calc(.2s * var(--mk)) var(--ease-io), opacity calc(.5s * var(--mk)) var(--ease-out), transform calc(.5s * var(--mk)) var(--ease-out); }
html.layout-clean .kpi:hover { border-color: var(--rule-strong); }
html.layout-clean.intro .kpi { opacity: 0; transform: translateY(8px); }
html.layout-clean .kpi:nth-child(2) { transition-delay: calc(.04s * var(--mk)); } html.layout-clean .kpi:nth-child(3) { transition-delay: calc(.08s * var(--mk)); }
html.layout-clean .kpi:nth-child(4) { transition-delay: calc(.12s * var(--mk)); } html.layout-clean .kpi:nth-child(5) { transition-delay: calc(.16s * var(--mk)); } html.layout-clean .kpi:nth-child(6) { transition-delay: calc(.2s * var(--mk)); }
html.layout-clean .kpi .label { order: 0; font: 500 calc(var(--fs-label) * 1px)/1.3 var(--sans); letter-spacing: 0; color: var(--muted); margin-bottom: 10px; }
html.layout-clean .kpi .value { order: 1; margin: 0 0 8px; letter-spacing: calc(-.03em * var(--track)); }
html.layout-clean .kpi .delta { order: 2; margin-top: 0; font-size: 13.5px; color: var(--muted); }
html.layout-clean .kpi .delta.good, html.layout-clean .kpi .delta.good .arr { color: var(--pos-ink); }
html.layout-clean .kpi .delta.bad, html.layout-clean .kpi .delta.bad .arr { color: var(--neg-ink); }
html.layout-clean .kpi .delta .vs { color: var(--muted); }
html.layout-clean .kpi .kci { order: 3; }
html.layout-clean .kpi svg.spark { order: 4; margin-top: 12px; }
html.layout-clean .kpi svg.spark path { stroke: var(--accent); stroke-width: 1.5; }
html.layout-clean .insights .kicker { color: var(--muted); }
html.layout-clean .insights li { padding-left: 14px; border-left: 2px solid var(--rule-strong); }
html.layout-clean .insights .n { color: var(--primary-text); }
html.layout-clean .section .sec-rule { border-top-color: var(--rule); }
html.layout-clean .section .sec-kicker { color: var(--primary-text); font-weight: 500; }
html.layout-clean .method { background: var(--footer-bg); color: var(--footer-ink); border-top: var(--rule-w) solid var(--rule); padding-bottom: 56px; }
html.layout-clean .method .bigmark { display: none; }
@media (max-width: 700px) {
  html.layout-clean .kpi-grid { row-gap: 8px; }
  html.layout-clean .kpi, html.layout-clean .kpi.t { padding: 12px 12px 10px; }
  html.layout-clean .kpi .label { font-size: 13px; margin-bottom: 6px; }
  html.layout-clean .insights li { padding-left: 12px; }
}
/* motion.enabled = false: same as prefers-reduced-motion */
html.no-motion *, html.no-motion *::before, html.no-motion *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }

/* Print / Save as PDF --------------------------------------------------- */
.print-only { display: none; }
html.print-prep .page, html.print-prep .filterbar .inner { max-width: 760px; }
html.print-prep .g { grid-template-columns: [full-start] 20px [wide-start content-start] minmax(0, 1fr) [content-end wide-end] 20px [full-end]; }
html.print-prep .band .dek, html.print-prep .band #kpis, html.print-prep .band #insights, html.print-prep .section .sec-kicker, html.print-prep .section-head { grid-row: auto; }
html.print-prep .grid { column-gap: 0; }
html.print-prep .kpi .value { margin-bottom: 14px; } html.print-prep .kpi .label { font-size: 18px; } html.print-prep .band .dek { font-size: 22px; }
html.print-prep .chart.half, html.print-prep .chart.third { grid-column: span 12 !important; }
@media print {
  @page { size: A4; margin: 12mm 10mm; }
  :root, [data-theme="dark"] { --bg: #fff; --surface: #fff; --surface-2: #f4f3ef; --ink: #000; --ink-2: #111; --muted: #555; --rule: #ddd; --rule-strong: #000; --context: #e2ded8; --footer-bg: #fff; --footer-ink: #000; }
  body { font-size: 10.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .hdr, .menu, .scrim, .toc, .art, .filterbar, .table-tools, .pager, .help-pop, .method summary .acc-state, .method summary .chev { display: none !important; }
  .hero { padding-top: 0; } .hero .g { min-height: 0 !important; padding-top: 36px; }
  .rv { opacity: 1 !important; transform: none !important; }
