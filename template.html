  if (phone) box.querySelectorAll(".num").forEach(n => { n.firstChild.textContent = n.firstChild.textContent.replace(/[\u00a0\u202f](?=(mil|mi|bi|tri|K|M|B)\b)/u, " "); });
  el._h = next;
  if (live) { void box.offsetWidth; box.querySelectorAll(".fill").forEach(f => f.style.height = ""); }
};

/** share — part-to-whole strip with direct labels (use instead of a pie). {dim, measure, top?: 6, minShare?: 0.02}
 *  Slices under minShare are folded into "outros" so labels stay readable. */
CHARTS.share = (el, c) => {
  const m = MEAS[c.measure], rows = filterRows({ except: c.dim });
  if (!rows.length) return empty(el);
  let data = d3.rollups(rows, v => agg(v, m), r => r[c.dim]).map(([k, v]) => ({ k, v })).filter(d => d.k != null && d.v != null && Number.isFinite(d.v)).sort((a, b) => b.v - a.v);
  const top = c.top || 6, tot0 = d3.sum(data, d => d.v), minShare = c.minShare ?? 0.02;
  let keep = 0;
  while (keep < data.length && keep < top - 1 && data[keep].v / tot0 >= minShare) keep++;
  const rest = data.slice(keep);
  if (rest.length > 1 || (rest.length === 1 && rest[0].v / tot0 < minShare))
    data = data.slice(0, keep).concat([{ k: rest.length > 1 ? `${T.others} (${rest.length})` : rest[0].k, v: d3.sum(rest, d => d.v), other: true }]);
  const total = d3.sum(data, d => d.v);
  const box = document.createElement("div");
  box.className = "share" + (hasSel(c.dim) ? " has-sel" : "");
  const col = (d, i) => d.other ? C.context : C.pal[i % C.pal.length];
  let cum = 0;
  const pcts = data.map((d, i) => { const sh = Math.max(0, d.v) / total, x = cum; cum += sh;
    if (sh < 0.06) return "";
    const pos = x + 0.1 > 1 ? `right:0` : `left:${x * 100}%`;
    return `<span data-i="${i}" class="${isSel(c.dim, d.k) ? "sel" : ""}" style="${pos};--d:${i * 60}ms">${fmt(sh, "percent")}</span>`; }).join("");
  box.innerHTML = `<div class="pcts">${pcts}</div><div class="strip">${data.map((d, i) => `<div class="seg-s${isSel(c.dim, d.k) ? " sel" : ""}" data-i="${i}" style="flex-grow:${Math.max(0, d.v)};background:${col(d, i)}"></div>`).join("")}</div>
    <div class="labels">${data.map((d, i) => `<div data-i="${i}" class="${isSel(c.dim, d.k) ? "sel" : ""}"><i style="background:${col(d, i)}"></i>${esc(d.k)} (${fmt(d.v / total, "percent")})<small>${fmt(d.v, m.format, true)}</small></div>`).join("")}</div>`;
  box.querySelectorAll("[data-i]").forEach(n => {
    const d = data[+n.dataset.i]; if (d.other) return;
    n.onclick = e => { hideTip(); toggleCat(c.dim, d.k, e.shiftKey || e.metaKey); };
    n.onmouseenter = e => showTip(e, `<b>${esc(d.k)}</b><br>${fmt(d.v, m.format)} · ${fmt(d.v / total, "percent")}`);
    n.onmousemove = moveTip; n.onmouseleave = hideTip;
  });
  el.append(box);
};

/** multiples — small multiples per category; the other series drawn in grey as context.
 *  {dim, measure, top?: 12, grain?: "month", scale?: "shared" | "independent"}
 *  shared (default) = honest magnitude comparison; independent = compare SHAPES (say so in the subtitle). */
CHARTS.multiples = (el, c) => {
  const m = MEAS[c.measure], rows = filterRows({ except: c.dim }), grain = grainOf(c);
  if (!rows.length) return empty(el);
  const keys = d3.groupSort(rows, v => -agg(v, m), r => r[c.dim]).filter(k => k != null).slice(0, c.top || 12);
  const all = keys.map(k => ({ k, rows: rows.filter(r => r[c.dim] === k) })).map(a => ({ ...a, s: series(a.rows, m, grain) })).filter(a => a.s.length);
  if (!all.length) return empty(el);
  const shared = c.scale !== "independent";
  const gMax = d3.max(all, a => d3.max(a.s, d => d.value)), gMin = isAdditive(m) ? 0 : d3.min(all, a => d3.min(a.s, d => d.value));
  // context lines: raw values when shared; each series scaled to its own max when independent
  const box = document.createElement("div");
  box.className = "multiples" + (hasSel(c.dim) ? " has-sel" : "");
  // pick a column count that fills rows evenly (6 → 3×2, not 5+1)
  const maxCols = Math.max(1, Math.floor((el.clientWidth + 30) / (200 + 30))), n = all.length;
  let cols = Math.min(maxCols, n);
  for (let k = cols; k >= Math.max(2, Math.ceil(cols / 2)); k--) if (n % k === 0) { cols = k; break; }
  box.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  el.append(box);
  const w = Math.floor((el.clientWidth - (cols - 1) * 30) / cols);
  const cr = compareRange(), prevRows = cr ? filterRows({ except: c.dim, range: cr }) : null;
  const dom = all.length ? d3.extent(all.flatMap(a => a.s), d => d.date) : null;
  for (const a of all) {
    const cell = document.createElement("div");
    cell.className = "multiple" + (isSel(c.dim, a.k) ? " sel" : "");
    const tot = agg(a.rows, m);
    let chHtml = "";
    if (prevRows) {
      const p = agg(prevRows.filter(r => r[c.dim] === a.k), m);
      if (p) { const good = ((tot >= p) === ((m.good || "up") === "up")); chHtml = `<div class="ch" style="color:${good ? C.posInk : C.negInk}">${changeTxt(tot, p, m)} <span style="color:${C.muted};font-weight:400">${esc(compareLabel())}</span></div>`; }
    }
    cell.innerHTML = `<h4 title="${esc(T.clickHint)}">${esc(a.k)}<span>${fmt(tot, m.format, true)}</span></h4>${chHtml}`;
    cell.querySelector("h4").onclick = e => toggleCat(c.dim, a.k, e.shiftKey || e.metaKey);
    const own = d3.max(a.s, d => d.value) || 1;
    const yMax = shared ? gMax : own, yMin = shared ? gMin : (isAdditive(m) ? 0 : d3.min(a.s, d => d.value));
    const ctx = all.filter(o => o.k !== a.k).flatMap(o => { const om = d3.max(o.s, d => d.value) || 1; return o.s.map(d => ({ date: d.date, value: shared ? d.value : d.value / om * own, k: o.k })); });
    cell.append(Plot.plot(basePlot({
      width: w, height: 100, marginLeft: 0, marginRight: 8, marginTop: 10, marginBottom: 20,
      x: { type: "utc", domain: dom, label: null, ticks: dom, tickFormat: d => monName(d) + " " + String(d.getUTCFullYear()).slice(2), tickSize: 0 },
      y: { domain: [yMin, yMax], axis: null },
      marks: [
        Plot.ruleY([yMin], { stroke: C.rule }),
        Plot.lineY(ctx, { x: "date", y: "value", z: "k", stroke: C.context, strokeWidth: 1, curve: "monotone-x" }),
        Plot.areaY(a.s, { x: "date", y: "value", y1: yMin, fill: C.accent, fillOpacity: C.areaOp, curve: "monotone-x" }),
        Plot.lineY(a.s, { x: "date", y: "value", stroke: C.line, strokeWidth: 1.5, curve: "monotone-x" }),
        Plot.dot(a.s.slice(-1), { x: "date", y: "value", fill: C.line, r: 2.5 }),
        Plot.ruleX(a.s, Plot.pointerX({ x: "date", stroke: C.ink, strokeOpacity: 0.5 })),
        Plot.tip(a.s, Plot.pointerX({ x: "date", y: "value", ...tipStyle(), title: d => `${a.k}\n${fmtPeriod(d.date, grain)}\n${fmt(d.value, m.format)}` })),
      ],
    })));
    // first tick left-aligned, last right-aligned so they never spill out of the cell
    const ticks = cell.querySelectorAll('g[aria-label="x-axis tick label"] text');
    if (ticks.length === 2) { ticks[0].setAttribute("text-anchor", "start"); ticks[1].setAttribute("text-anchor", "end"); }
    box.append(cell);
  }
 
};

/** heatmap — two categorical axes, or time parts "$month" | "$weekday" | "$year" on either axis.
 *  {x, y, measure, cellHeight?: 34, marginLeft?: 110}. Click a cell to filter its dimension(s). */
const TIMEPART = {
  $month: { key: d => d.getUTCMonth(), label: k => monName(new Date(Date.UTC(2024, k, 1))) },
  $weekday: { key: d => (d.getUTCDay() + 6) % 7, label: k => new Intl.DateTimeFormat(LANG, { weekday: "short", timeZone: "UTC" }).format(new Date(Date.UTC(2024, 0, 1 + k))).replace(".", "") },
  $year: { key: d => d.getUTCFullYear(), label: k => String(k) },
};
CHARTS.heatmap = (el, c) => {
  const m = MEAS[c.measure];
  const rows = filterRows({ except: DIMS[c.y] ? c.y : DIMS[c.x] ? c.x : null });
  if (!rows.length) return empty(el);
  const acc = f => TIMEPART[f] ? (r => TIMEPART[f].key(r[DATE])) : (r => r[f]);
  const lab = f => TIMEPART[f] ? TIMEPART[f].label : (k => k);
  const data = d3.flatRollup(rows, v => agg(v, m), acc(c.x), acc(c.y)).map(([x, y, v]) => ({ x, y, v })).filter(d => d.x != null && d.y != null && d.v != null && Number.isFinite(d.v));
  if (!data.length) return empty(el);
  const order = f => TIMEPART[f] ? [...new Set(rows.map(acc(f)))].sort((a, b) => a - b) : d3.groupSort(rows, v => -agg(v, m), r => r[f]).filter(k => k != null);
  const [lo, hi] = d3.extent(data, d => d.v);
  // normalize: "row" → each cell's color is its position between its row's min and max (the value stays in text + tooltip)
  const rowExt = c.normalize === "row" ? new Map(d3.rollups(data, v => d3.extent(v, d => d.v), d => d.y)) : null;
  data.forEach(d => { const [a, b] = rowExt ? rowExt.get(d.y) : [lo, hi]; d.n = (d.v - a) / ((b - a) || 1); });
  const W = el.clientWidth, yDom = order(c.y), xDom = order(c.x), cellH = c.cellHeight || 34;
  const ml = Math.max(c.marginLeft || 0, labelMargin(yDom.map(lab(c.y)), W, 60, 0.3)), colW = (W - ml) / xDom.length, showText = colW > 40;
  // narrow columns (phones): month / weekday initials on the axis, the full name stays in the tooltip
  const short = f => TIMEPART[f] && (f === "$month" || f === "$weekday") && colW < 28 ? (k => lab(f)(k).charAt(0).toUpperCase()) : lab(f);
  const sel = hasSel(c.y) || hasSel(c.x);
  const dim = d => sel && !((!DIMS[c.y] || !hasSel(c.y) || isSel(c.y, d.y)) && (!DIMS[c.x] || !hasSel(c.x) || isSel(c.x, d.x)));
  const fig = Plot.plot(basePlot({
    width: W, height: yDom.length * cellH + 34, marginLeft: ml, marginBottom: 4, marginTop: 26, marginRight: 0,
    x: { domain: xDom, label: null, axis: "top", tickFormat: short(c.x), tickSize: 0 },
    y: { domain: yDom, label: null, tickFormat: lab(c.y), tickSize: 0 },
    color: { type: "linear", domain: [0, 0.5, 1], range: C.heat, interpolate: "lab" },
    marks: [
      Plot.cell(data, { x: "x", y: "y", fill: "n", inset: 1, fillOpacity: d => dim(d) ? 0.25 : 1 }),
      showText ? Plot.text(data, { x: "x", y: "y", text: d => fmtTight(d.v, m.format, hi >= 1e4), fill: d => d.n > 0.62 ? C.heatInkHi : C.ink2, fontSize: 12, fillOpacity: d => dim(d) ? 0.35 : 1 }) : null,
      Plot.tip(data, Plot.pointer({ x: "x", y: "y", ...tipStyle(), title: d => `${lab(c.x)(d.x)} · ${lab(c.y)(d.y)}\n${m.label}: ${fmt(d.v, m.format)}` })),
    ],
  }));
  fig.style.cursor = "pointer";
  fig.addEventListener("click", e => { const v = fig.value; if (!v) return; hideTip(); if (DIMS[c.y]) toggleCat(c.y, v.y, e.shiftKey); else if (DIMS[c.x]) toggleCat(c.x, v.x, e.shiftKey); });
  el.append(fig);
};

/** scatter — two measures per category with direct labels and an average reference line.
 *  {dim, x, y, r?: measure, labelTop?: 10, height?} */
CHARTS.scatter = (el, c) => {
  const mx = MEAS[c.x], my = MEAS[c.y], mr = c.r ? MEAS[c.r] : null;
  const rows = filterRows({ except: c.dim });
  if (!rows.length) return empty(el);
  const data = d3.groups(rows, r => r[c.dim]).filter(([k]) => k != null)
    .map(([k, v]) => ({ k, x: agg(v, mx), y: agg(v, my), r: mr ? agg(v, mr) : 1 }));
  const avgY = agg(rows, my);
  const labelSet = new Set(data.slice().sort((a, b) => b.r - a.r || b.x - a.x).slice(0, c.labelTop ?? 10).map(d => d.k));
  data.forEach(d => { if (isSel(c.dim, d.k)) labelSet.add(d.k); });
  const sel = hasSel(c.dim), W = el.clientWidth, H = c.height || Math.round(Math.max(280, Math.min(440, W * 0.55)));
  const col = d => sel && !isSel(c.dim, d.k) ? C.context : C.accent;
  const edge = d => sel && !isSel(c.dim, d.k) ? C.context : C.ink;
  // log axes get clean 1-2-5 ticks instead of Plot's dense defaults
  let xTicks = Math.max(3, Math.floor(W / 150));
  if (c.logX) {
    const [lo, hi] = d3.extent(data, d => d.x).map(v => Math.max(v, 1e-9)), out = [];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) for (const k of [1, 2, 5]) { const t = k * 10 ** e; if (t >= lo * 0.8 && t <= hi * 1.25) out.push(t); }
    xTicks = out.length > Math.floor(W / 70) ? out.filter((t, i) => String(t)[0] !== "2") : out;
    if (W < 560 && xTicks.filter(t => String(t)[0] === "1").length >= 2) xTicks = xTicks.filter(t => String(t)[0] === "1");   // phones: powers of ten only
  }
  const fig = Plot.plot(basePlot({
    width: W, height: H, marginLeft: yMargin(data.map(d => d.y), my.format, c.zeroY ?? isAdditive(my)), marginBottom: 40, marginTop: 26, marginRight: 16,
    x: { label: `${mx.label}${c.logX ? (PT ? " (escala log)" : " (log scale)") : ""} →`, labelAnchor: "right", grid: true, nice: !c.logX, zero: c.logX ? false : (c.zeroX ?? isAdditive(mx)), tickFormat: v => fmtAxis(v, mx.format), type: c.logX ? "log" : "linear", ticks: xTicks },
    y: { label: `↑ ${my.label}`, labelAnchor: "top", grid: true, nice: true, zero: c.zeroY ?? isAdditive(my), tickFormat: v => fmtAxis(v, my.format) },
    r: { range: [4, 20] },
    marks: [
      Plot.ruleY([avgY], { stroke: C.ink, strokeOpacity: 0.6, strokeDasharray: "2,4" }),
      Plot.text([avgY], { y: d => d, frameAnchor: "right", text: () => `${T.avg} ${fmt(avgY, my.format)}`, dy: -8, fill: C.muted, fontSize: 12, textAnchor: "end", className: "ptlabel" }),   // decluttered first: wins over point names
      Plot.dot(data, { x: "x", y: "y", r: mr ? "r" : 6, fill: col, fillOpacity: 0.9, stroke: edge, strokeWidth: 0.75 }),
      Plot.text(data.filter(d => labelSet.has(d.k)).sort((a, b) => b.r - a.r || b.x - a.x), { x: "x", y: "y", text: "k", dy: -13, fill: C.ink, fontSize: 13, fontWeight: 500, stroke: C.bg, strokeWidth: 3.5, paintOrder: "stroke", className: "ptlabel" }),
      Plot.tip(data, Plot.pointer({ x: "x", y: "y", ...tipStyle(), title: d => `${d.k}\n${mx.label}: ${fmt(d.x, mx.format)}\n${my.label}: ${fmt(d.y, my.format)}${mr ? `\n${mr.label}: ${fmt(d.r, mr.format)}` : ""}` })),
    ],
  }));
  fig.style.cursor = "pointer";
  fig.addEventListener("click", e => { const v = fig.value; if (v) { hideTip(); toggleCat(c.dim, v.k, e.shiftKey || e.metaKey); } });
  el.append(fig); declutter(el, ".ptlabel text");
};

/** dumbbell — per-category change between the comparison window and now (Cleveland dot plot).
 *  {dim, measure, top?: 12, sort?: "value"|"change", marginLeft?} */
CHARTS.dumbbell = (el, c) => {
  const m = MEAS[c.measure], cr = compareRange();
  if (!cr) return empty(el, T.noPrev);
  const cur = new Map(d3.rollups(filterRows({ except: c.dim }), v => agg(v, m), r => r[c.dim]));
  const prev = new Map(d3.rollups(filterRows({ except: c.dim, range: cr }), v => agg(v, m), r => r[c.dim]));
  let data = [...cur].filter(([k, v]) => k != null && prev.has(k) && Number.isFinite(v) && Number.isFinite(prev.get(k))).map(([k, v]) => ({ k, cur: v, prev: prev.get(k) }));
  // |Δ| below what one decimal shows (0,05 p.p. / 0,05%) is "no change": muted, unsigned (B3)
  data.forEach(d => { d.ch = m.format === "percent" ? d.cur - d.prev : d.cur / d.prev - 1; d.up = (d.cur >= d.prev) === ((m.good || "up") === "up"); d.flat = Math.abs(d.ch) < 0.0005; });
  data.sort((a, b) => c.sort === "change" ? b.ch - a.ch : b.cur - a.cur);
  data = data.slice(0, c.top || 12);
  if (!data.length) return empty(el);
  const W = el.clientWidth, sel = hasSel(c.dim), faded = d => sel && !isSel(c.dim, d.k);
  const fig = Plot.plot(basePlot({
    width: W, height: data.length * 34 + 40, marginLeft: Math.max(c.marginLeft || 0, labelMargin(data.map(d => d.k), W, 80, .35)), marginRight: 72, marginTop: 24,
    x: { grid: true, label: null, axis: "top", nice: true, zero: c.zero ?? isAdditive(m), tickFormat: v => fmtAxis(v, m.format), ticks: Math.max(3, Math.floor(W / 120)) },
    y: { domain: data.map(d => d.k), label: null, tickSize: 0 },
    marks: [
      Plot.ruleY(data, { y: "k", x1: "prev", x2: "cur", stroke: d => d.flat ? C.muted : d.up ? C.accent : C.neg, strokeWidth: 4, strokeOpacity: d => faded(d) ? 0.25 : 1 }),
      Plot.dot(data, { y: "k", x: "prev", r: 4.5, fill: C.bg, stroke: C.ink, strokeWidth: 1.25, strokeOpacity: d => faded(d) ? 0.3 : 1 }),
      Plot.dot(data, { y: "k", x: "cur", r: 6, fill: d => faded(d) ? C.context : d.flat ? C.muted : d.up ? C.accent : C.neg, stroke: d => faded(d) ? C.context : C.ink, strokeWidth: 1.25 }),
      Plot.text(data, { y: "k", frameAnchor: "right", text: d => d.flat ? changeTxt(d.cur, d.prev, m).replace(/^[+−-]/, "") : changeTxt(d.cur, d.prev, m), dx: 66, textAnchor: "end", fill: d => faded(d) ? C.faint : d.flat ? C.muted : d.up ? C.posInk : C.negInk, fontWeight: 500, fontSize: 13 }),
      Plot.tip(data, Plot.pointerY({ y: "k", x: "cur", ...tipStyle(), title: d => `${d.k}\n${T.current}: ${fmt(d.cur, m.format)}\n${compareLabel()}: ${fmt(d.prev, m.format)}\n${changeTxt(d.cur, d.prev, m)}` })),
    ],
  }));
  const leg = document.createElement("div");
  leg.className = "legend-inline";
  leg.innerHTML = `<span><i style="background:${C.bg};border:1.25px solid ${C.ink};border-radius:50%"></i>${esc(prevLegend())}</span><span><i style="background:${C.accent};border:1.25px solid ${C.ink};border-radius:50%"></i>${esc(T.current)}</span>`;
  fig.style.cursor = "pointer";
  fig.addEventListener("click", e => { const v = fig.value; if (v) { hideTip(); toggleCat(c.dim, v.k, e.shiftKey || e.metaKey); } });
  el.append(leg, fig);
};

/** change — diverging bars of % change (or p.p. for rates) per category vs the comparison window.
 *  Scale-free, so it works when categories differ by orders of magnitude (unlike a dumbbell).
 *  {dim, measure, top?: 15 (largest by current value), minBase?: 0} */
CHARTS.change = (el, c) => {
  const m = MEAS[c.measure], cr = compareRange();
  if (!cr) return empty(el, T.noPrev);
  const cur = new Map(d3.rollups(filterRows({ except: c.dim }), v => agg(v, m), r => r[c.dim]));
  const prev = new Map(d3.rollups(filterRows({ except: c.dim, range: cr }), v => agg(v, m), r => r[c.dim]));
  let data = [...cur].filter(([k, v]) => k != null && Number.isFinite(v) && prev.get(k) > (c.minBase || 0)).map(([k, v]) => ({ k, cur: v, prev: prev.get(k) }));
  data.sort((a, b) => b.cur - a.cur);
  data = data.slice(0, c.top || 15);
  data.forEach(d => { d.ch = m.format === "percent" ? d.cur - d.prev : d.cur / d.prev - 1; d.up = (d.ch >= 0) === ((m.good || "up") === "up"); });
  data.sort((a, b) => b.ch - a.ch);
  if (!data.length) return empty(el);
  const W = el.clientWidth, sel = hasSel(c.dim), faded = d => sel && !isSel(c.dim, d.k);
  // domain from the data (zero always inside), not symmetric: no empty half when every change has the same sign
  const mn = Math.min(0, d3.min(data, d => d.ch)), mxv = Math.max(0, d3.max(data, d => d.ch)), sp = (mxv - mn) || 0.01;
  const xdom = d3.scaleLinear().domain([mn - (mn < 0 ? sp * 0.22 : 0), mxv + (mxv > 0 ? sp * 0.22 : 0)]).nice().domain();
  const tf = v => m.format === "percent" ? `${NF.sDec.format(v * 100)}` : NF.sPct.format(v).replace(/[,.]0%/, "%");
  const fig = Plot.plot(basePlot({
    width: W, height: data.length * 30 + 36, marginLeft: Math.max(c.marginLeft || 0, labelMargin(data.map(d => d.k), W, 36, 0.3)), marginRight: Math.max(8, Math.ceil(textW([tf(xdom[1])]) / 2) + 4), marginTop: 24,
    x: { domain: xdom, axis: "top", grid: true, label: null, tickFormat: tf, ticks: Math.max(3, Math.floor(W / 110)) },
    y: { domain: data.map(d => d.k), label: null, tickSize: 0 },
    marks: [
      Plot.barX(data, { x: "ch", y: "k", fill: d => faded(d) ? C.context : d.up ? C.accent : C.neg, insetTop: 5, insetBottom: 5 }),
      Plot.ruleX([0], { stroke: C.ink, strokeWidth: 1.25 }),
      Plot.text(data.filter(d => d.ch >= 0), { x: "ch", y: "k", text: d => changeTxt(d.cur, d.prev, m), dx: 6, textAnchor: "start", fill: C.ink, fontSize: 13, fontWeight: 500 }),

/** likert — diverging stacked distribution of a row-level score (1–5, 1–7, 0–10), overall + per group.
 *  Bad answers stack left of the center line, good ones right, the neutral point straddles it.

CHARTS.likert = (el, c) => {

  const inkOf = i => { const col = d3.color(colOf.get(i)); return col && d3.hsl(col).l < 0.55 ? "#fff" : "#000"; };

  box.className = "lk" + (hasSel(c.dim) ? " has-sel" : "");
  box.innerHTML = `<div class="legend-inline lk-legend">${ord.map(i => `<span><i style="background:${colOf.get(i)}"></i>${esc(lab(i))}</span>`).join("")}</div>`;
  groups.forEach((g, gi) => {
    const row = document.createElement(g.all ? "div" : "button");
    row.className = "lk-row" + (g.all ? " all" : "") + (g.small ? " small" : "") + (!g.all && isSel(c.dim, g.k) ? " sel" : "");
    row.style.setProperty("--d", `${Math.min(gi * 60, 600) * MK}ms`);

      return `<i data-i="${i}" style="flex:${tot ? v / tot : 0} 1 0;background:${colOf.get(i)};color:${inkOf(i)}">${v >= 0.07 && i !== neu ? NF.pct0.format(g.sh[i]) : ""}</i>`; };

      <span class="lk-bar"><span class="lk-track"><span class="lk-side neg" style="width:${g.L / M * 50}%">${left.map(seg("neg")).join("")}</span><span class="lk-side pos" style="width:${g.R / M * 50}%">${right.map(seg("pos")).join("")}</span>

    marks: [

      all.lo != null ? Plot.rectX([all], { x1: "lo", x2: "hi", fill: C.accent, fillOpacity: 0.22 }) : null,
      Plot.ruleX([all.v], { stroke: C.ink, strokeDasharray: "3,3", strokeOpacity: 0.8 }),
      Plot.text([all], { x: "v", frameAnchor: "bottom", dy: 14, text: () => `${T.overall} ${fmt(all.v, m.format)}`, fill: C.muted, fontSize: 12, textAnchor: "middle" }),
      Plot.ruleY(data, { y: "k", x1: d => d.lo ?? d.v, x2: d => d.hi ?? d.v, stroke: d => faded(d) ? C.context : d.small ? C.muted : sigColor(m, d), strokeWidth: 2.5, strokeDasharray: d => d.small ? "3,3" : null }),
      Plot.dot(data, { y: "k", x: "v", r: 6, fill: d => faded(d) ? C.context : d.small ? C.bg : sigColor(m, d), stroke: d => faded(d) ? C.context : d.small ? C.muted : C.ink, strokeWidth: 1.5 }),
      Plot.text(data, { y: "k", frameAnchor: "right", dx: mr - 4, textAnchor: "end", text: d => narrow ? `${fmt(d.v, m.format, true)}${d.small ? " ◌" : ""}` : `${fmt(d.v, m.format)} · n ${fmt(d.n, "number", true)}${d.small ? " ◌" : ""}`, fill: d => d.small ? C.muted : C.ink, fontSize: 13, fontWeight: 500 }),
      Plot.tip(data, Plot.pointerY({ y: "k", x: "v", ...tipStyle(), title: tip })),
    ],
  }));
  fig.style.cursor = "pointer";
  fig.addEventListener("click", e => { const v = fig.value; if (v) { hideTip(); toggleCat(c.dim, v.k, e.shiftKey || e.metaKey); } });
  const leg = document.createElement("div"); leg.innerHTML = sigLegend(m, `<span><i class="ci-band" style="background:${C.accent}"></i>${esc(T.overall)} · ${esc(T.ci)} ${PCT}%</span>`);
  el.append(leg.firstElementChild, fig);
};

/** drivers — which segments pull the overall score down (or up), weighted by volume.
 *  impact = share of answers × (segment − rest of the base), in the metric's unit (p.p. / pts / score).
 *  "If this group scored like everyone else, the overall would move by −impact."
 *  {measure (with ci), dims: [dim, …], top?: 12}. Not significant → grey; small sample → lighter + ◌. */
CHARTS.drivers = (el, c) => {
  const m = MEAS[c.measure];
  let data = [];
  for (const dim of c.dims || []) data = data.concat(groupStats(filterRows({ except: dim }), m, dim).groups);
  adjust(data.map(d => d.test));                         // one Holm family across every group shown
  data.forEach(d => { d.sig = !!d.test?.sig; });
  data = data.filter(d => d.impact != null && isFinite(d.impact));
  if (!data.length) return empty(el);
  const all = stat(filterRows(), m), top = c.top || 12;
  data.sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));
  data = data.slice(0, top).sort((a, b) => (isGood(m, 1) ? a.impact - b.impact : b.impact - a.impact));
  // "Resolvido no 1º contato?" + "Não" → "Resolvido no 1º contato? Não" (no "?:")
  data.forEach(d => { const dl = DIMS[d.dim]?.label || d.dim; d.label = /[?:]$/.test(dl) ? `${dl} ${d.k}` : `${dl}: ${d.k}`; d.bad = !isGood(m, d.impact); });
  const W = el.clientWidth, narrow = W < 560, ext = d3.max(data, d => Math.abs(d.impact)) || 0.01;
  const tf = v => m.format === "percent" ? NF.sDec.format(v * 100) : m.format === "nps" ? NF.sDec.format(v * 100) : NF.sDec2.format(v);
  const unit = m.format === "percent" ? ` ${T.pp}` : m.format === "nps" ? " pts" : "";
  const fill = d => !d.sig ? C.context : d.bad ? C.neg : C.pos;
  const tip = d => plainTip(`<b>${esc(d.label)}</b><br>${esc(T.impact)}: ${tf(d.impact)}${unit}<br>${esc(m.label)}: ${fmt(d.v, m.format)} vs. ${fmt(d.rest, m.format)} ${esc(T.restShort)}<br>${esc(T.shareAnswers)}: ${fmt(d.share, "percent")} · ${nTxt(d.n)}<br>${esc(T.ifLikeRest)} ${fmt(all.v - d.impact, m.format)}<br>${esc(sigTxt(d.test))}${smallTip(d)}`);
  const ml = labelMargin(data.map(d => d.label), W, narrow ? 100 : 140, narrow ? 0.45 : 0.4), rowH = Math.max(30, wrapLines(data.map(d => d.label), ml) * 15 + 10);
  const fig = Plot.plot(basePlot({
    width: W, height: data.length * rowH + 44, marginLeft: ml, marginRight: narrow ? 46 : 90, marginTop: 26,
    x: { domain: [-ext * 1.15, ext * 1.15], axis: "top", grid: true, label: null, tickFormat: tf, ticks: Math.max(3, Math.floor((W - ml) / 110)) },
    y: { domain: data.map(d => d.label), label: null, axis: null },
    marks: [
      wrapAxisY(ml, data.map(d => d.label)),
      Plot.barX(data, { x: "impact", y: "label", fill, fillOpacity: d => d.small ? 0.5 : 1, insetTop: 5, insetBottom: 5, rx: C.radius }),
      Plot.ruleX([0], { stroke: C.ink, strokeWidth: 1.25 }),
      Plot.text(data.filter(d => d.impact >= 0), { x: "impact", y: "label", text: d => `${tf(d.impact)}${narrow ? "" : unit}${d.sig ? "" : " n.s."}${d.small ? " ◌" : ""}`, dx: 6, textAnchor: "start", fill: d => d.sig ? C.ink : C.muted, fontSize: 13, fontWeight: 500 }),
      Plot.text(data.filter(d => d.impact < 0), { x: "impact", y: "label", text: d => `${tf(d.impact)}${narrow ? "" : unit}${d.sig ? "" : " n.s."}${d.small ? " ◌" : ""}`, dx: -6, textAnchor: "end", fill: d => d.sig ? C.ink : C.muted, fontSize: 13, fontWeight: 500 }),
      Plot.tip(data, Plot.pointerY({ y: "label", x: "impact", ...tipStyle(), title: tip })),
    ],
  }));
  fig.querySelectorAll('[aria-label="bar"] rect').forEach((r, i) => data[i] && r.classList.toggle("neg", data[i].impact < 0));
  fig.style.cursor = "pointer";
  fig.addEventListener("click", e => { const v = fig.value; if (v) { hideTip(); toggleCat(v.dim, v.k, e.shiftKey || e.metaKey); } });
  const leg = document.createElement("div");
  leg.innerHTML = `<div class="legend-inline"><span><i style="background:${C.neg}"></i>${esc(T.pullsDown)}</span><span><i style="background:${C.pos}"></i>${esc(T.pullsUp)}</span><span><i style="background:${C.context}"></i>n.s. = ${esc(T.ns)}</span><span>◌ ${esc(T.smallSample)}</span></div>`;
  el.append(leg.firstElementChild, fig);
};

/** trendci — metric over time with its confidence band; small-n periods are hollow points.
 *  {measure (with ci), grain?: "month", height?, zero?: false}. The tooltip tests each period against the previous one. */
CHARTS.trendci = (el, c) => {
  const m = MEAS[c.measure], rows = filterRows(), grain = grainOf(c);
  if (!rows.length) return empty(el);
  const fl = GRAIN[grain];
  const data = d3.rollups(rows, v => statFrom(sums(v, m), m), r => +fl(r[DATE])).map(([k, s]) => ({ date: new Date(k), ...s })).filter(d => d.n > 0).sort((a, b) => a.date - b.date);
  if (!data.length) return empty(el);
  data.forEach((d, i) => { d.test = i ? diffTest(d, data[i - 1]) : null; });
  const W = el.clientWidth, H = c.height || Math.round(Math.max(240, Math.min(340, W * 0.42))), narrow = W < 560;
  const tip = d => plainTip(statTip(fmtPeriod(d.date, grain), d, m, d.test ? `<br>${esc(T.vsPrevPoint)}: ${fmtDiff(d.test.d, m)} — ${esc(sigTxt(d.test))}` : ""));
  const last = data.at(-1);
  el.append(Plot.plot(basePlot({
    width: W, height: H, marginRight: narrow ? 14 : 70, marginTop: 30, marginLeft: yMargin(data.flatMap(d => [d.lo ?? d.v, d.hi ?? d.v]), m.format, c.zero ?? false),
    x: { type: "utc", label: null, ticks: Math.max(3, Math.floor(W / 90)), tickFormat: timeTick },
    y: { grid: true, label: null, nice: true, zero: c.zero ?? false, tickFormat: v => fmtAxis(v, m.format), ticks: 5 },
    marks: [
      Plot.areaY(data, { x: "date", y1: d => d.lo ?? d.v, y2: d => d.hi ?? d.v, fill: C.accent, fillOpacity: 0.32, curve: "monotone-x" }),
      Plot.lineY(data, { x: "date", y: "v", stroke: C.line, strokeWidth: 1.75, curve: "monotone-x" }),
      Plot.dot(data, { x: "date", y: "v", r: d => d.small ? 4 : 3, fill: d => d.small ? C.bg : C.line, stroke: d => d.small ? C.muted : C.line, strokeWidth: 1.25 }),
      Plot.text([last], { x: "date", y: "v", text: d => fmt(d.v, m.format), dx: narrow ? 0 : 8, dy: narrow ? -14 : 0, textAnchor: narrow ? "end" : "start", fill: C.ink, fontWeight: 500, fontSize: 14, stroke: C.bg, strokeWidth: 4, paintOrder: "stroke" }),
      Plot.ruleX(data, Plot.pointerX({ x: "date", stroke: C.ink, strokeOpacity: 0.5 })),
      Plot.tip(data, Plot.pointerX({ x: "date", y: "v", ...tipStyle(), title: tip })),
    ],
  })));
  const leg = document.createElement("div");
  leg.className = "legend-inline";
  leg.innerHTML = `<span><i class="ci-band" style="background:${C.accent}"></i>${esc(T.ci)} ${PCT}%</span>${data.some(d => d.small) ? `<span><i class="dot hollow"></i>${esc(T.smallSample)} (n < ${SC.minN})</span>` : ""}`;
  el.prepend(leg);
};

/** themes — open-text comments grouped into themes (computed offline in cx.py, stored as a dim).
 *  Per theme: comments and share, sentiment by score band (100% bar), the metric among those
 *  respondents vs. the rest (tested), and PII-scrubbed sample quotes (static, full period).
 *  {dim: "tema", band: "faixa_nps", bands?: ["Detratores", "Neutros", "Promotores"], measure?, top?: 12,
 *   verbatims?: {theme: [{text, band}]}, terms?: {theme: [..]}, exclude?: ["Sem tema específico"]} */
CHARTS.themes = (el, c) => {
  const m = c.measure ? MEAS[c.measure] : null;
  const rows = filterRows({ except: c.dim }).filter(r => r[c.dim] != null);
  if (!rows.length) return empty(el);
  const N = rows.length, bands = c.bands || [...new Set(rows.map(r => r[c.band]).filter(v => v != null))];
  const bcol = bands.length === 3 ? [C.dv[0], C.dv[2], C.dv[4]] : bands.map((_, i) => C.pal[i % C.pal.length]);
  const binks = bands.length === 3 ? [C.dvInk[0], C.dvInk[2], C.dvInk[4]] : bands.map(() => C.ink);
  const gs = m ? new Map(groupStats(rows, m, c.dim).groups.map(g => [g.k, g])) : new Map();
  let data = d3.groups(rows, r => r[c.dim]).map(([k, v]) => {
    const cnt = bands.map(b => v.filter(r => r[c.band] === b).length), nb = d3.sum(cnt);
    return { k, n: v.length, share: v.length / N, sh: cnt.map(x => nb ? x / nb : 0), nb, st: gs.get(k), small: v.length < SC.minN };
  }).sort((a, b) => b.n - a.n);
  const excl = new Set(c.exclude || []), maxShare = d3.max(data, d => d.share) || 1;
  data = data.filter(d => !excl.has(d.k)).slice(0, c.top || 12).concat(data.filter(d => excl.has(d.k)));
  const box = document.createElement("div");
  box.className = "th" + (hasSel(c.dim) ? " has-sel" : "");
  // legend first, then the column heads right above the rows they name (B5)
  box.innerHTML = `<div class="legend-inline">${bands.map((b, i) => `<span><i style="background:${bcol[i]}"></i>${esc(b)}</span>`).join("")}</div>`
    + `<div class="th-head"><span>${esc(T.theme)}</span><span>${esc(T.commentsCount)}</span><span>${esc(T.bandSplit)}</span>${m ? `<span class="r">${esc(m.label)}</span>` : ""}</div>`;
  data.forEach((d, i) => {
    const row = document.createElement("div");
    row.className = "th-row" + (d.small ? " small" : "") + (isSel(c.dim, d.k) ? " sel" : "") + (excl.has(d.k) ? " other" : "");
    row.style.setProperty("--d", `${Math.min(i * 60, 600) * MK}ms`);
    const quotes = (c.verbatims || {})[d.k] || [], terms = (c.terms || {})[d.k] || [];
    const st = d.st, mark = st && !excl.has(d.k) ? `<span class="np-mark" style="color:${st.small && !st.sig ? C.muted : sigInk(m, st)}">${st.sig ? (st.test.d > 0 ? "▲" : "▼") : "≈"}</span>` : "";
    row.innerHTML = `<button class="th-main" aria-pressed="${isSel(c.dim, d.k)}">
        <span class="th-name"><b>${esc(d.k)}</b>${terms.length ? `<small>${esc(terms.join(" · "))}</small>` : ""}${smallBadge(d)}</span>
        ${i === 0 ? `<span class="th-ml" aria-hidden="true">${esc(T.commentsCount)}</span>` : ""}<span class="th-count"><span class="th-share"><i style="width:${d.share / maxShare * 100}%"></i></span><span class="num">${fmt(d.n)} <small>${fmt(d.share, "percent")}</small></span></span>
        ${i === 0 ? `<span class="th-ml" aria-hidden="true">${esc(T.bandSplit)}</span>` : ""}<span class="th-bands">${d.sh.map((p, j) => `<i style="flex-grow:${p};background:${bcol[j]};color:${binks[j]}">${p >= 0.12 ? NF.pct0.format(p) : ""}</i>`).join("")}</span>
        ${m ? `<span class="th-val">${mark}${st ? fmt(st.v, m.format) : "—"}</span>` : ""}
      </button>${quotes.length ? `<ul class="th-quotes">${quotes.slice(0, c.quotes || 2).map(q => `<li>“${esc(q.text)}”${q.band ? ` <small>— ${esc(q.band)}</small>` : ""}</li>`).join("")}</ul>` : ""}`;
    const main = row.querySelector(".th-main");
    rowTip(main, `<b>${esc(d.k)}</b><br>${fmt(d.n)} ${esc(T.commentsWord)} · ${fmt(d.share, "percent")} ${esc(T.ofComments)}<br><span class="k">${bands.map((b, j) => `${esc(b)} ${fmt(d.sh[j], "percent")}`).join(" · ")}</span>${st ? `<br>${esc(m.label)}: ${fmt(st.v, m.format)}${st.lo != null ? ` (${ciTxt(st, m)})` : ""}${vsRestTip(st, m)}` : ""}${smallTip(d)}`);
    main.onclick = e => { hideTip(); toggleCat(c.dim, d.k, e.shiftKey || e.metaKey || e.ctrlKey); };
    box.append(row);
  });
  if (Object.keys(c.verbatims || {}).length) box.insertAdjacentHTML("beforeend", `<p class="th-note">${esc(T.quotesNote)}</p>`);
  el.append(box);
};

function empty(el, msg = T.empty) { el.innerHTML = `<div class="empty">${esc(msg)}</div>`; }

/* ======================================================================== */
/* 8. Static scaffolding (masthead, insights, sections, filter bar, method)  */
/* ======================================================================== */
const $ = s => document.querySelector(s);
function scaffold() {
  const brandName = META.brand || THEME.brand || "";
  if (THEME.logo) { $("#brand").innerHTML = `<img class="logo" src="${THEME.logo}" alt="${esc(brandName)}" style="--logo-h:${+THEME.logoHeight || 26}px">`; }
  else $("#brand").textContent = brandName;
  if (META.sample) { const b = $("#sample-badge"); b.hidden = false; b.textContent = typeof META.sample === "string" ? META.sample : T.sample; }
  $("#kicker").textContent = META.kicker || "";
  $("#title").textContent = META.title || "";
  // static copy is computed in Python for the default view: with a filter on, a discreet note says so (A8) —
  // the browser never rewrites a sentence it can't recompute
  const scopeNote = (txt, tag = "span") => `<${tag} class="scope-note"><b>${esc(T.scopeBadge)}</b> ${esc(txt)}</${tag}>`;
  $("#dek").innerHTML = md(META.subtitle || "") + (/\d/.test(META.subtitle || "") ? scopeNote(T.scopeDek) : "");
  if (!META.subtitle) $("#dek").remove();
  const by = [];
  if (META.source) by.push(`<span>${esc(T.source)}: <b>${esc(META.source)}</b></span>`);
  if (DATE_EXTENT[0]) by.push(`<span>${esc(T.period)}: <b>${dFull.format(DATE_EXTENT[0])} – ${dFull.format(DATE_EXTENT[1])}</b></span>`);
  by.push(`<span>${esc(T.generated)}: <b>${esc(META.generated || new Date().toLocaleDateString(LANG))}</b></span>`);
  if (META.author) by.push(`<span><b>${esc(META.author)}</b></span>`);
  if (META.sample) by.unshift(`<span class="mob-only">${esc(typeof META.sample === "string" ? META.sample : T.sample)}</span>`);
  $("#byline").innerHTML = by.join("");
  $("#btn-theme").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  $("#theme-label").textContent = document.documentElement.dataset.theme === "dark" ? T.light : T.dark;
  { const nm = `${T.useTheme} ${$("#theme-label").textContent.toLowerCase()}`; $("#btn-theme").setAttribute("aria-label", nm); $("#btn-theme").title = nm; }
  $("#btn-print").onclick = () => window.print();   // beforeprint → preparePrint() re-renders at A4 width

  // headline insights — computed upstream from the data, never invented
  const ins = R.insights || [];
  const endDot = t => /[.!?:;…]$/.test(String(t || "").trim().replace(/[*_`]+$/, "")) ? t : `${t}.`;   // the title reads as its own sentence before the text
  if (ins.length) $("#insights").innerHTML = `<p class="kicker">${esc(META.insightsKicker || T.highlights)}</p>${scopeNote(T.scopeInsights, "p")}<ol>${ins.map((x, i) =>
    `<li class="rv"><span class="n">${String(i + 1).padStart(2, "0")}</span><h3>${md(x.text ? endDot(x.title) : x.title)}</h3>${x.text ? `<p>${md(x.text)}</p>` : ""}</li>`).join("")}</ol>${R.insightsScope ? `<p class="scope">${esc(T.scope)} ${esc(R.insightsScope)}.</p>` : ""}`;
  else $("#insights").remove();
  if ($("#dek")) $("#dek").classList.add("rv");

  // sections → figures; each figure keeps its spec in fig._spec
  const host = $("#sections"), numbered = META.numberSections !== false;
  (R.sections || []).forEach((s, si) => {
    const sec = document.createElement("section");
    sec.className = "section g"; sec.id = s.id || "s" + si;
    const nn = String(si + 1).padStart(2, "0");
    sec._label = s.toc || String(s.title || "").replace(/\*\*|_/g, "");
    sec.innerHTML = `<div class="sec-rule"></div><p class="kicker sec-kicker rv">${esc(s.kicker || `${T.section} ${nn}`)}</p><div class="section-head rv">${/\d/.test(`${s.title || ""} ${s.lede || ""}`) ? scopeNote(T.scopeSection, "p") : ""}<h2>${numbered ? `${si + 1}. ` : ""}${md(s.title)}</h2>${s.question ? `<p class="q">${md(s.question)}</p>` : ""}${s.lede ? `<p class="lede">${md(s.lede)}</p>` : ""}</div><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    (s.charts || []).forEach((c, ci) => {
      const fig = document.createElement("figure");
      const w = widthOf(c);
      fig.className = "chart " + w; fig.dataset.width = w;
      fig.dataset.chart = c.id || `${sec.id}-${ci}`;
      fig.dataset.type = c.type;
      const hid = `h-${fig.dataset.chart}`.replace(/[^\w-]/g, "_");
      if (c.title) fig.setAttribute("aria-labelledby", hid); else fig.setAttribute("aria-label", c.type);
      const q = questionOf(c);
      fig.innerHTML = `<figcaption>${c.title ? `<h3 id="${hid}">${md(c.title)}</h3>` : ""}${q ? `<p class="question"><span class="qk">${esc(T.question)}</span>${esc(q)}</p>` : ""}${c.subtitle ? `<p>${md(c.subtitle)}</p>` : ""}</figcaption><div class="viz"></div>${c.note ? `<p class="note">${md(c.note)}</p>` : ""}`;
      fig._spec = c;
      grid.append(fig);
    });
    host.append(sec);
  });

  const tb = R.table || {};
  $("#table-kicker").textContent = tb.kicker || T.tableKicker;
  $("#table-title").textContent = tb.title || T.tableTitle;
  $("#table-q").textContent = tb.question || T.tableQ;
  $("#table-section")._label = tb.title || T.tableTitle;
  $("#table-section .sec-kicker").classList.add("rv"); $("#table-section .section-head").classList.add("rv");
  $("#t-search").placeholder = T.search; $("#t-search").setAttribute("aria-label", T.search);
  $("#t-csv").textContent = "↓ " + T.csvView;
  $("#t-raw").textContent = "↓ " + T.csvRaw;

  // methodology & data quality — black footer
  const M = R.methodology || {};
  const defs = (F.measures || []).filter(m => m.description || m.question).map(m => `<dt>${esc(m.label)}</dt><dd>${m.description ? md(m.description) : ""}${m.question ? `<span class="mq"><span class="qk">${esc(T.question)}</span>${esc(m.question)}</span>` : ""}</dd>`).join("");
  const list = a => `<ul>${a.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  // optional "about" column from spec.contexto (shown only with contexto.exibir: true)
  const CX = R.contexto || {}, arr = v => v == null ? [] : Array.isArray(v) ? v : [v];
  const about = CX.exibir ? [
    CX.objetivo ? `<dt>${esc(T.goal)}</dt><dd>${md(CX.objetivo)}</dd>` : "",
    CX.publico ? `<dt>${esc(T.audience)}</dt><dd>${md(CX.publico)}</dd>` : "",
    arr(CX.pontos_chave).length ? `<dt>${esc(T.keyPoints)}</dt><dd>${arr(CX.pontos_chave).map(md).join("; ")}</dd>` : "",
    arr(CX.suposicoes).length ? `<dt>${esc(T.assumptions)}</dt><dd>${arr(CX.suposicoes).map(md).join("; ")}</dd>` : "",
  ].join("") : "";
  // always last, collapsed by default (details/summary: keyboard + screen-reader friendly); print/PDF expands it
  $("#method .g").innerHTML = `<details class="acc" id="method-acc"><summary><span class="kicker">${esc(M.kicker || T.methodTitle)}</span><span class="acc-state">${esc(T.methodOpen)}</span><span class="chev" aria-hidden="true">${chevron}</span></summary><div class="acc-body"><div class="acc-in">
    <div class="cols">
      ${about ? `<div class="rv about"><h4>${esc(T.aboutTitle)}</h4><dl>${about}</dl></div>` : ""}
      ${defs ? `<div class="rv"><h4>${esc(T.definitions)}</h4><dl>${defs}</dl></div>` : ""}
      ${M.cleaning?.length ? `<div class="rv"><h4>${esc(T.cleaning)}</h4>${list(M.cleaning)}</div>` : ""}
      ${M.quality?.length ? `<div class="rv"><h4>${esc(T.quality)}</h4>${list(M.quality)}</div>` : ""}
    </div>
    ${M.colophon ? `<p class="colophon">${md(M.colophon)}</p>` : ""}</div></div></details>
    <p class="bigmark" aria-hidden="true">${esc(META.brand || THEME.brand || META.title || "")}</p>`;
  $("#method")._label = T.methodShort;
  initAccordion($("#method-acc"));

  const paint = (cv, bg, fgFn, cell, gap) => {
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const cols = Math.floor(w / cell), rows = Math.floor(h / cell), rnd = mulberry(7);
    for (let i = 0; i < cols; i++) {
      const v = s[Math.min(s.length - 1, Math.floor(i / cols * s.length))].value, top = 1 - (v - lo) / (hi - lo);
      for (let j = 0; j < rows; j++) { const yy = j / rows; fgFn(g, i * cell, j * cell, cell - gap, yy - top, rnd()); }
    }
  };
  // dark panel: art-ink dots below the curve, density fading with depth; accent crest on the curve
  const ink = d3.color(C.artInk) || d3.color("#fff"), a = (o) => { const c = ink.copy(); c.opacity = o; return c.formatRgb(); };
  paint($("#art-l"), C.artBg || "#000", (g, x, y, sz, d, r) => {
    if (d < -0.02) { if (r < 0.03) { g.fillStyle = a(.25); g.fillRect(x, y, sz, sz); } return; }
    if (d < 0.04) { g.fillStyle = C.accent; g.fillRect(x, y, sz, sz); return; }
    if (r < 0.92 - d * 0.9) { g.fillStyle = r < 0.5 ? a(1) : a(.55); g.fillRect(x, y, sz, sz); }
  }, 7, 2);
  // primary-color panel: the same curve as accent columns with a dithered edge
  paint($("#art-r"), C.hero || C.primary, (g, x, y, sz, d, r) => {
    if (d > 0.1 || (d > -0.06 && r < 0.5 + d * 4)) { g.fillStyle = d > 0.35 && r < 0.18 ? C.heroInk : C.accent; g.fillRect(x, y, sz, sz); }
  }, 10, 0);
}

// used by verify.py; also handy in the devtools console
window.__report = { checks: R.checks || null, contexto: R.contexto || null,
  grain: () => curGrain(),
  chartGrains: () => [...document.querySelectorAll("figure.chart")].filter(f => ["line", "multiples", "trendci"].includes(f._spec.type)).map(f => ({ id: f.dataset.chart, grain: grainOf(f._spec), override: !!f._spec.grainOverride })),
  questions: () => [...document.querySelectorAll("figure.chart")].map(f => ({ id: f.dataset.chart, expected: questionOf(f._spec), shown: f.querySelector("p.question")?.lastChild?.textContent ?? null })).filter(q => q.expected), stat: k => stat(ROWS, MEAS[k]), statFiltered: k => stat(filterRows(), MEAS[k]), setCats, toggleCat, reset, setRange: (a, b) => setRange([parseDate(a), parseDate(b)]), preset: p => setRange(presetRange(p), p), revealAll, state: null, ready: false };

/* Print: always light, every reveal in its final state, charts re-rendered at A4 content width (~720 px) */
let printTheme = null;
function preparePrint() {
  if (printTheme) return;
  printing = true;
  printTheme = document.documentElement.dataset.theme;
  document.documentElement.classList.add("print-prep");
  document.documentElement.dataset.theme = "light"; readColors();
  const acc = $("#method-acc"); if (acc) { acc._wasOpen = acc.open; acc.open = true; }
  revealAll(); update(); revealAll();
}
function endPrint() {
  if (!printTheme) return;
  document.documentElement.classList.remove("print-prep");
  document.documentElement.dataset.theme = printTheme; printTheme = null; readColors();
  const acc = $("#method-acc"); if (acc && acc._wasOpen === false) acc.open = false;
  update(); printing = false;
}
window.__report.preparePrint = preparePrint; window.__report.endPrint = endPrint; window.__report.layoutGrid = layoutGrid;

function boot() {
  scaffold(); initTable();
  S.preset = DEFAULT_PRESET; S.range = DATE ? presetRange(S.preset) : null;
  booted = true; update();
  drawArt(); armReveals(); initScroll();
  // intro: blocks layout — the hero opens full-height, then settles and the art strip wipes in; clean layout — title and KPI cards fade up
  if (document.documentElement.classList.contains("intro")) setTimeout(() => document.documentElement.classList.remove("intro"), 350 * MK);
  let w = innerWidth, t;
  addEventListener("resize", () => { if (Math.abs(innerWidth - w) < 16) return; w = innerWidth; clearTimeout(t); t = setTimeout(() => { layoutKPIs(); layoutBlocks(); renderCharts(); drawArt(); }, 150); });
  document.fonts?.ready?.then(() => equalizeCaptions());
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", e => { try { if (localStorage.getItem("report-theme")) return; } catch (x) {} applyTheme(e.matches ? "dark" : "light", false); });
  addEventListener("beforeprint", preparePrint);
  addEventListener("afterprint", endPrint);
  window.__report.ready = true;
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
